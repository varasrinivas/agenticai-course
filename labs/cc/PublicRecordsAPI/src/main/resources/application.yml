server:
  port: 8080

spring:
  datasource:
    url: jdbc:h2:mem:ucc;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  h2:
    console:
      enabled: true
      path: /h2
  sql:
    init:
      mode: always

logging:
  level:
    com.publicrecords: INFO

##############################################################################
# Tier 3: AWS Lambda Deployment (SAM Template)
#
# Deploys the Bronze Table Validation Agent as an AWS Lambda function
# with a 15-minute timeout for processing all 15 states.
#
# Prerequisites:
#   - AWS SAM CLI installed
#   - AWS credentials configured
#   - ANTHROPIC_API_KEY stored in AWS Secrets Manager
##############################################################################

AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  Bronze Table Validation Agent - Parallel state validation for UCC filings

Globals:
  Function:
    Timeout: 900
    MemorySize: 1024
    Runtime: python3.12

Parameters:
  AnthropicApiKeySecret:
    Type: String
    Default: "anthropic-api-key"
    Description: Name of the Secrets Manager secret containing the Anthropic API key

  MaxWorkers:
    Type: Number
    Default: 5
    Description: Maximum parallel state tester threads

Resources:
  BronzeValidatorFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../../
      Handler: lambda_handler.handler
      Description: Runs Bronze table validation across 15 states in parallel
      MemorySize: 1024
      Timeout: 900
      Environment:
        Variables:
          MAX_WORKERS: !Ref MaxWorkers
          ANTHROPIC_SECRET_NAME: !Ref AnthropicApiKeySecret
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource: !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${AnthropicApiKeySecret}-*"
        - Statement:
            - Effect: Allow
              Action:
                - s3:PutObject
              Resource: !Sub "arn:aws:s3:::${ReportBucket}/*"

  # S3 bucket for storing validation reports
  ReportBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "bronze-validation-reports-${AWS::AccountId}"
      LifecycleConfiguration:
        Rules:
          - Id: ExpireOldReports
            Status: Enabled
            ExpirationInDays: 90

  # CloudWatch scheduled rule to run validation daily
  DailyValidationRule:
    Type: AWS::Events::Rule
    Properties:
      Description: Trigger Bronze validation daily at 6am UTC
      ScheduleExpression: "cron(0 6 * * ? *)"
      State: DISABLED  # Enable manually when ready
      Targets:
        - Arn: !GetAtt BronzeValidatorFunction.Arn
          Id: DailyValidation
          Input: '{"run_type": "full_seed"}'

  DailyValidationPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref BronzeValidatorFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt DailyValidationRule.Arn

Outputs:
  FunctionArn:
    Description: Lambda function ARN
    Value: !GetAtt BronzeValidatorFunction.Arn

  ReportBucketName:
    Description: S3 bucket for validation reports
    Value: !Ref ReportBucket

  FunctionName:
    Description: Lambda function name
    Value: !Ref BronzeValidatorFunction

version: "3.8"

services:
  app:
    # TODO 1: Configure the build context and Dockerfile reference
    # Hint: Use "build:" with "context" pointing to the current directory
    # and "dockerfile" referencing your Dockerfile name.
    build:
      context: .
      dockerfile: Dockerfile

    container_name: ucc-production-agent

    # TODO 2: Add environment variables the agent needs at runtime
    # Required variables:
    #   - ANTHROPIC_API_KEY (read from your .env file using ${} syntax)
    #   - PYTHONUNBUFFERED=1 (so logs stream in real time)
    #   - DUCKDB_PATH=/app/data/ucc.duckdb (where the database lives inside the container)
    environment: []

    # TODO 3: Mount a named volume so DuckDB data persists across container restarts
    # Hint: Map a named volume to /app/data inside the container
    volumes: []

    # TODO 4: Expose the agent's HTTP port to the host
    # Hint: The app listens on port 8080
    ports: []

    stdin_open: true
    tty: true
    restart: unless-stopped

    # TODO 5: Add a health check so Docker knows when the container is ready
    # Hint: Use a lightweight Python command to verify the SDK is importable
    # Configure interval, timeout, retries, and start_period

# TODO 6: Declare the named volume you referenced in TODO 3
# Hint: Use the "volumes:" top-level key with a "driver: local" entry
volumes: {}

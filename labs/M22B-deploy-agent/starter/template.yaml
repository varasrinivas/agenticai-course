# M22B: AWS SAM Template for UCC Agent (Starter — complete the TODOs)
# ======================================================================
# AWS SAM (Serverless Application Model) is a CloudFormation extension
# that simplifies deploying Lambda functions + API Gateway.
#
# Deploy:  sam build --use-container && sam deploy --guided

AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  UCC Filing Research Agent API — deployed as AWS Lambda behind API Gateway.

# ---------------------------------------------------------------------------
# Parameters — values passed in at deploy time
# ---------------------------------------------------------------------------
Parameters:
  AnthropicApiKey:
    Type: String
    Description: Anthropic API Key (or "mock" for mock mode)
    NoEcho: true
    # NoEcho: true means CloudFormation will never display this value
    # in the console, CLI output, or CloudFormation events.

# ---------------------------------------------------------------------------
# Globals — defaults applied to ALL functions in this template
# ---------------------------------------------------------------------------
Globals:
  Function:
    Timeout: 300       # 5 minutes — agent queries can be slow
    MemorySize: 512    # 512 MB — enough for the agent + dependencies

# ---------------------------------------------------------------------------
# Resources — the AWS resources to create
# ---------------------------------------------------------------------------
Resources:
  # TODO 1: Define the Lambda function
  # Uncomment and review the resource below.
  #
  # Key properties:
  #   Handler: points to lambda_handler.handler (file.function)
  #   Runtime: python3.11 (matches our Dockerfile)
  #   CodeUri: "." means package everything in the current directory
  #   Environment: passes the API key as an environment variable
  #   Events: creates an API Gateway HTTP API with a catch-all route
  #
  # The {proxy+} path with ANY method routes ALL requests to Lambda,
  # so FastAPI's own router handles path matching.


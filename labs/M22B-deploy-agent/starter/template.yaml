# ---------------------------------------------------------------------------
# Outputs — values displayed after deployment
# ---------------------------------------------------------------------------
Outputs:
  ApiUrl:
    Description: API Gateway endpoint URL for the UCC Agent
    Value: !Sub "https://${ServerlessHttpApi}.execute-api.${AWS::Region}.amazonaws.com"

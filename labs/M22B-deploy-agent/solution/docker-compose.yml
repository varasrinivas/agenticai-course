# M22B: Docker Compose for local development (Solution)
# ========================================================
# Run:    docker compose up --build
# Stop:   docker compose down
# Logs:   docker compose logs -f

version: "3.8"

services:
  ucc-agent:
    build: .

    ports:
      - "8000:8000"

    env_file:
      - .env

    environment:
      - PYTHONUNBUFFERED=1
      - ENVIRONMENT=docker

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    restart: unless-stopped

    volumes:
      - .:/app

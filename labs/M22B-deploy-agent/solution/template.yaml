# M22B: AWS SAM Template for UCC Agent (Solution)
# ==================================================

AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  UCC Filing Research Agent API — deployed as AWS Lambda behind API Gateway.

Parameters:
  AnthropicApiKey:
    Type: String
    Description: Anthropic API Key (or "mock" for mock mode)
    NoEcho: true

Globals:
  Function:
    Timeout: 300
    MemorySize: 512

Resources:
  UCCAgentFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: lambda_handler.handler
      Runtime: python3.11
      CodeUri: .
      Architectures:
        - x86_64
      Environment:
        Variables:
          ANTHROPIC_API_KEY: !Ref AnthropicApiKey
          ENVIRONMENT: aws-lambda
      Events:
        RootEvent:
          Type: HttpApi
          Properties:
            Path: /
            Method: ANY
        ProxyEvent:
          Type: HttpApi
          Properties:
            Path: /{proxy+}
            Method: ANY

Outputs:
  ApiUrl:
    Description: API Gateway endpoint URL for the UCC Agent
    Value: !Sub "https://${ServerlessHttpApi}.execute-api.${AWS::Region}.amazonaws.com"
  FunctionArn:
    Description: Lambda function ARN
    Value: !GetAtt UCCAgentFunction.Arn

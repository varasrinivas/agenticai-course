# Tier 1 -- the lab.
#
# One service. There is no database and no broker: this agent reads a
# repository and writes a repository.
#
# NOTE THE :ro ON BOTH SOURCE MOUNTS. The PreToolUse hooks already deny every
# write against those trees, and this is the second layer -- a guardrail that
# exists in exactly one place is a guardrail one refactor from being gone.
services:
  agent:
    build:
      context: ./solution
    env_file:
      - ./solution/.env
    environment:
      BH_REFERENCE_ROOT: /work/reference-umlite
      BH_LEGACY_ROOT: /work/bhauthtrack
      BH_EMIT_ROOT: /work/bh-um-lite
      ARTIFACT_DIR: /work/artifacts
      AUDIT_LOG: /work/artifacts/modernization_audit.jsonl
      BH_BACKLOG_PATH: /work/reference-umlite/BACKLOG.md
    volumes:
      # Evidence. Read-only.
      - ./reference-umlite:/work/reference-umlite:ro
      - ./bhauthtrack:/work/bhauthtrack:ro
      # Output.
      - ./bh-um-lite:/work/bh-um-lite
      - ./artifacts:/work/artifacts
    # A modernization run is long. Do not let a restart policy silently
    # re-run phases that already completed -- resume is explicit, via
    # --resume against session_state.json.
    restart: "no"

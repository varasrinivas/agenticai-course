# Default values for the case-service chart (M32). Override per environment (dev/stage/prod) with
# `helm install -f values-prod.yaml`. Templating these is what makes one chart serve every environment.
image:
  repository: umliteacr.azurecr.io/um-case-svc
  tag: latest
replicaCount: 2
service:
  port: 8081
env:
  EVENTS_ENABLED: "true"
  SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/um_case
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70
resources:
  requests: { cpu: 250m, memory: 512Mi }
  limits: { cpu: "1", memory: 1Gi }

# NGINX ingress (Phase 5 / Track 5, M29) — TARGET PATTERN for the Kubernetes deployment (Track 6).
# In-cluster, an Ingress is the HTTP entry point: it terminates TLS and routes host/path → Services.
# Locally we use Kong (docker-compose); on AKS this Ingress fronts the same services. Apply with
# `kubectl apply -f infra/k8s/ingress.yaml` once the services + ingress-nginx controller exist.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: um-lite
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
spec:
  ingressClassName: nginx
  rules:
    - host: um-lite.local
      http:
        paths:
          - path: /prior-auth
            pathType: Prefix
            backend:
              service:
                name: um-intake-svc
                port:
                  number: 3000
          - path: /api/cases
            pathType: Prefix
            backend:
              service:
                name: um-case-svc
                port:
                  number: 8081
          - path: /graphql
            pathType: Prefix
            backend:
              service:
                name: um-case-svc
                port:
                  number: 8081

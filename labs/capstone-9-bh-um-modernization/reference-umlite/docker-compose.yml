# UM-Lite local infrastructure
# Brings up the backing services that mirror the Optum UM architecture:
#   - Postgres        -> the "Master Nodes" Postgres in the diagram (UM Case, etc.)
#   - Redpanda        -> stands in for KaaS / EventHub (Kafka API compatible)
#   - Redpanda Console-> visual topic/message browser (great for learning Kafka)
#   - Redis           -> the Redis Cache subnet
#   - Camunda 7       -> the BPM + DMN engine (used from Phase 3)
#
# Usage:
#   docker compose up -d        # start everything
#   docker compose ps           # health
#   docker compose down         # stop (keeps volumes)
#   docker compose down -v      # stop and wipe data

name: um-lite

services:
  postgres:
    image: postgres:16-alpine
    container_name: umlite-postgres
    environment:
      POSTGRES_USER: umlite
      POSTGRES_PASSWORD: umlite
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # init.sql creates the per-service databases on first boot
      - ./infra/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U umlite -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  redpanda:
    image: redpandadata/redpanda:v24.2.7
    container_name: umlite-redpanda
    command:
      - redpanda
      - start
      - --smp=1
      - --overprovisioned
      - --node-id=0
      - --kafka-addr=PLAINTEXT://0.0.0.0:29092,OUTSIDE://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://redpanda:29092,OUTSIDE://localhost:9092
    ports:
      - "9092:9092"    # kafka bootstrap for host apps
      - "9644:9644"    # admin api
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 5s
      timeout: 3s
      retries: 10

  redpanda-console:
    image: redpandadata/console:v2.7.2
    container_name: umlite-redpanda-console
    environment:
      KAFKA_BROKERS: redpanda:29092
    ports:
      - "8085:8080"    # open http://localhost:8085 to watch topics/messages
    depends_on:
      redpanda:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    container_name: umlite-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Camunda 7 = combined BPMN + DMN engine. Used starting Phase 3.
  # Self-contained (embedded H2) for now; we point it at Postgres in Phase 3.
  camunda:
    image: camunda/camunda-bpm-platform:run-7.21.0
    container_name: umlite-camunda
    ports:
      - "8088:8080"    # Camunda webapps + REST: http://localhost:8088/camunda  (demo/demo)
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/engine-rest/engine || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Keycloak = OIDC identity provider (Phase 5, M28). Stands in for PingFederate / One Healthcare ID.
  # Dev mode; create the "um-lite" realm + a client in the admin console (http://localhost:8087, admin/admin).
  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    container_name: umlite-keycloak
    command: ["start-dev"]
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8087:8080"    # http://localhost:8087  (issuer: /realms/um-lite)

  # Elasticsearch = the search engine (Phase 5, M26). OpenSearch is the API-compatible fork; we use
  # Elasticsearch 8 here so it lines up cleanly with spring-data-elasticsearch. Security off for local dev.
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    container_name: umlite-elasticsearch
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"    # http://localhost:9200
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Read replica (Phase 5, M27). A second Postgres instance used as the read endpoint. True streaming
  # replication is an extension; this stand-in lets the app route reads to a separate node for the lab.
  postgres-replica:
    image: postgres:16-alpine
    container_name: umlite-postgres-replica
    environment:
      POSTGRES_USER: umlite
      POSTGRES_PASSWORD: umlite
      POSTGRES_DB: postgres
    ports:
      - "5433:5432"    # reads → jdbc:postgresql://localhost:5433
    volumes:
      - pgdata_replica:/var/lib/postgresql/data
      - ./infra/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  # Kong = API gateway (Phase 5, M29). DB-less / declarative mode reading infra/kong/kong.yml.
  kong:
    image: kong:3.7
    container_name: umlite-kong
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/kong.yml
      KONG_PROXY_LISTEN: 0.0.0.0:8000
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
    ports:
      - "8000:8000"    # proxy  → routes to the services
      - "8001:8001"    # admin API
    volumes:
      - ./infra/kong:/kong:ro

volumes:
  pgdata:
  pgdata_replica:

# BHAuthTrack 4.2 -- environment configuration
#
# This file ships INSIDE the WAR. There is one WAR per environment, built by editing this file
# and rebuilding. That is why the environment banner in header.jsp has read PROD in UAT since a
# 2015 deployment: somebody built the UAT WAR from a working copy they had not reverted.
#
# The credentials below are placeholders for the lab. In the real system they were the actual
# production values, in source control, from 2011 until the repository was archived.

bhauth.db.url=jdbc:oracle:thin:@//oradb-prod.bridgeway.internal:1521/BHAUTH
bhauth.db.user=BHAUTH_APP
bhauth.db.password=CHANGEME_placeholder_for_lab

bhauth.smtp.host=smtp-relay.bridgeway.internal

# The SFTP drop the nightly X12 278 importer walks. Also hard-coded in X12278ImportJob as a
# constant, which is the value that actually takes effect -- this property is read by nothing.
bhauth.x12.dropdir=/opt/bhauth/sftp/inbound/278

# Continued-stay reminder recipient. Likewise duplicated as a constant in the job.
bhauth.reminder.mailbox=bh-um-reviewers@bridgeway.example

# LDAP. Duplicated as constants in AuthFilter.
bhauth.ldap.url=ldap://ldap.bridgeway.internal:389
bhauth.ldap.base=ou=people,dc=bridgeway,dc=internal

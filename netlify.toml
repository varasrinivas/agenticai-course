# Netlify deploy config for the mobile PWA companion.
# To deploy: connect this repo on Netlify, or run `netlify deploy --prod`.
# For a one-shot drag-and-drop, just upload output/mobile/ to https://app.netlify.com/drop.

[build]
  publish = "output/mobile"

# Service worker scope + freshness:
# - Service-Worker-Allowed lets sw.js claim a broader scope if needed.
# - Disable the CDN cache for sw.js so updates ship immediately.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Service-Worker-Allowed = "/"

# Manifest should be served with the right MIME type and not aggressively cached.
[[headers]]
  for = "/manifest.json"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "public, max-age=300"

# Module HTML can be cached briefly; the SW handles offline behavior.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=300"

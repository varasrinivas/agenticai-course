very lab today, and your skills transfer — Antigravity uses the same Gemini models, the same agentic concepts (plans, diffs, tool approvals), and very similar context-file conventions. Concepts in G02–G07 map almost one-to-one. You're evaluating tools for a company: factor the roadmap in. Google is consolidating individual-developer AI tooling under Antigravity while keeping Gemini Code Assist as the Google Cloud team product. What Just Happened? You learned the single most important \"gotcha\" in the 2026 Gemini ecosystem before investing hours of lab time. Tool landscapes shift; the durable skills are the workflows (context files, plan→diff→approve, AI code review), and those are exactly what this course drills."},{"id":"models","title":"The Models Underneath","text":"The Models Underneath Analogy First A delivery company doesn't send a semi-truck to deliver an envelope, and doesn't send a bicycle courier to move a piano. Before you know what vehicles exist, every delivery feels the same and you can't reason about speed or cost. Gemini Code Assist routes your requests to different Gemini models the same way: a fast, inexpensive model handles the envelope-sized jobs (completions as you type), while a larger reasoning model handles the piano-sized jobs (agent-mode refactors). Knowing the fleet helps you predict behavior — why completions feel instant but agent plans take seconds. Technical Definition As of mid-2026, Gemini Code Assist is powered by the Gemini 2.5 family (Flash and Pro, generally available) , with Gemini 3-series models (3.0 Flash, 3.1 Pro, 3.5 Flash) rolling out through preview and GA release channels. Two numbers matter most: Context window: up to 1 million tokens — roughly 30,000–50,000 lines of code can be \"in the model's head\" at once. This is what makes whole-project awareness possible (G05). Release channels: admins can pin teams to GA-only features or opt into preview features — useful for enterprises that need stability. Why It Matters A 1M-token context window means the difference between an assistant that sees one file and one that sees your whole service . Concretely: asked \"where is this discount actually applied?\", a single-file assistant guesses; a codebase-aware assistant answers with the three call sites across pricing.py , checkout.py , and promotions.py . You'll prove this to yourself in the G05 lab."},{"id":"course-map","title":"How This Course Works","text":"How This Course Works Twelve modules, roughly 70% hands-on. From G02 onward you build and evolve one project — Recipe Box , a small recipe-management web API — so each module's lab starts where the last one ended. By G11 you'll have written, tested, reviewed, and deployed it with Gemini Code Assist doing the heavy lifting at every stage. Module Topic You build G00 Orientation (you are here) The mental map G01 Setup & first suggestion Working install in VS Code / JetBrains G02 Code completion & generation Recipe Box core from comments alone G03 Chat, smart commands & actions Debugged + documented endpoints G04 Refactoring, tests & debugging A test suite and cleaned-up legacy code G05 Context: GEMINI.md & .aiexclude Project rules that change suggestions G06 Agent mode I: multi-file tasks A feature spanning 5 files G07 Agent mode II: MCP & tools A GitHub-connected agent workflow G08 Gemini CLI Terminal automation for Recipe Box G09 AI code reviews on GitHub Auto-reviewed pull requests G10 Google Cloud integrations Recipe Box live on Cloud Run G11 Enterprise, security & capstone The full lifecycle, end to end What you need A Google account (free tier works for most labs through June 17, 2026; a Standard license or trial is the durable path) VS Code (primary in labs) or a JetBrains IDE — both are covered in G01 Python 3.10+ installed (Recipe Box is a small Flask API; every snippet is complete and runnable) A GitHub account (for G07 and G09) A Google Cloud account with billing only for G10's deploy lab (free-tier credits cover it; the module includes a no-cloud fallback) What Just Happened? You've seen the destination (a deployed, AI-reviewed Recipe Box) and the route (12 modules across 6 feature families). Time to verify you absorbed the map — then on to G01 to install the tool."},{"id":"quiz","title":"Knowledge Check","text":"Knowledge Check 1. Which three \"modes\" describe how Gemini Code Assist fits into daily coding work? Compile, debug, deploy Suggest while you type, answer when you ask, act when you delegate Lint, format, refactor Search, copy, paste 2. A 10-person team wants higher quotas, enterprise security, and Cloud Run integration — but doesn't need suggestions tuned on its private repos. Which edition fits? Individuals (free) Standard Enterprise They must build their own with the Gemini API 3. What happens to Gemini Code Assist on June 18, 2026? The entire product shuts down for all users It becomes free for everyone The Individuals (free) and AI Pro/Ultra tiers stop being served; those users migrate to Antigravity. Standard/Enterprise continue. Only the JetBrains plugin is discontinued 4. Which capability is exclusive to the Enterprise edition? Agent mode Code customization — suggestions informed by your organization's private repositories Code completion Using GEMINI.md context files 5. Why does the 1-million-token context window matter in practice? It makes individual completions appear faster It reduces the subscription price The model can hold your whole project in context, so answers reference real code across many files instead of guessing from one file It allows offline use without an internet connection Quiz Complete! Ready for G01: Setup & Your First Suggestion → ← Course Home Gemini Code Assist Track Next → G01: Setup & First Suggestion"}]},{"file":"G01-setup.html","title":"G01: Setup & Your First Suggestion","sections":[{"id":"before-you-start","title":"Setup & Your First Suggestion","text":"Setup & Your First Suggestion In G00 you saw the map. Now we put the tool on your machine. By the end of this module a faded \"ghost text\" suggestion will appear in your editor and you'll accept it with one keypress. Before You Start Checklist A Google account. A personal Gmail account works for the free Individuals tier (active through June 17, 2026 — see G00). If your company gave you a Standard/Enterprise seat, use that work account. VS Code 1.85+ (Lab A) or a JetBrains IDE 2023.2+ such as IntelliJ IDEA or PyCharm (Lab B). Android Studio users: the plugin ships built in — jump to the note at the end of Lab B. Python 3.10+ so the verification snippet actually runs. Check with python --version . An internet connection — suggestions are generated by Gemini models in the cloud, not locally. Analogy First Installing Gemini Code Assist is like hiring that brilliant teammate from G00: there's a tiny bit of paperwork before they can start. The \"interview\" is installing the extension, the \"badge photo\" is signing in with Google, and the \"desk assignment\" is granting the extension permission to talk to Google's servers on your behalf. Skip any step and the teammate shows up but can't get past reception — which is exactly what's happening when people complain \"I installed it but nothing appears.\" The whole onboarding takes about five minutes when you do the steps in order."},{"id":"vscode-setup","title":"Lab A: VS Code Setup","text":"Lab A: VS Code Setup Install the extension Open VS Code. Press Ctrl+Shift+X (Windows/Linux) or Cmd+Shift+X (macOS) to open the Extensions panel. Search for \"Gemini Code Assist\" — the publisher must be Google . Click Install . Prefer the command line? This does the same thing: powershell / bash Copy code --install-extension Google.geminicodeassist ✅ Checkpoint A new sparkle/diamond icon (✦) appears in the Activity Bar on the left edge of VS Code. If you see it, the extension is installed. Sign in with Google Click the Gemini Code Assist icon in the Activity Bar, then click Sign in with Google . Your browser opens a Google sign-in page. Choose the account you decided on above and click Allow when asked to authorize the extension. ✅ Checkpoint The browser shows a success page and VS Code's Gemini panel now greets you by account name. The status bar (bottom of the window) shows a Gemini indicator without error badges. Create the lab folder We'll use one folder for the whole course. Create it and open it in VS Code: 📺 Windows macOS/Linux powershell Copy New-Item -ItemType Directory -Force \"$HOME\\gca-course\\recipe-box\" code \"$HOME\\gca-course\\recipe-box\" bash Copy mkdir -p ~/gca-course/recipe-box code ~/gca-course/recipe-box"},{"id":"first-suggestion","title":"Your First Suggestion","text":"Your First Suggestion Technical Definition Ghost text is the faded, italic inline preview of a suggested completion. It is not yet part of your file — it becomes real code only when you accept it with Tab . Press Esc to dismiss, or just keep typing to ignore it. When several alternatives exist, hover the suggestion to page through them. Trigger a completion In your new recipe-box folder, create a file named units.py and type this comment plus the first line of the function — type it, don't paste it , so the model sees you writing: units.py — type this yourself Copy # Convert a quantity in grams to ounces, rounded to 2 decimal places. # Raise a ValueError if grams is negative. def grams_to_ounces( Pause after the open parenthesis. Within a second or two, ghost text proposes the rest of the function. Press Tab to accept it. units.py — what you should see # Convert a quantity in grams to ounces, rounded to 2 decimal places. # Raise a ValueError if grams is negative. def grams_to_ounces( grams: float) -> float: if grams < 0: raise ValueError(\"grams must be non-negative\") return round(grams / 28.349523125, 2) ✦ Ghost text shown faded — press Tab to accept ✓ Accepted. The code is now real and saved with the file. ▶ ▮▮ ↻ Press ▶ to preview the ghost text flow Verify the generated code actually runs AI suggestions are drafts, not gospel — always run them. Add this to the bottom of units.py and run the file: units.py — verification harness Copy if __name__ == \"__main__\": try: print(grams_to_ounces(100)) # expected: 3.53 print(grams_to_ounces(0)) # expected: 0.0 or 0 print(grams_to_ounces(-5)) # expected: ValueError except ValueError as err: print(f\"Correctly rejected negative input: {err}\") terminal Copy python units.py ✅ Expected output 3.53 , then 0.0 , then Correctly rejected negative input: grams must be non-negative (your exact message may differ — the model writes its own wording). If the math or the error handling differs, that's your first real lesson: read what you accept . What Just Happened? You wrote a two-line comment describing intent (including an error-handling requirement) and the model produced a complete, typed, validated function. Notice what drove quality: the comment mentioned rounding and the negative-input rule, so the suggestion included both. Vague comment in, vague code out — this becomes a core skill in G02."},{"id":"jetbrains-setup","title":"Lab B: JetBrains Setup (IntelliJ / PyCharm)","text":"Lab B: JetBrains Setup (IntelliJ / PyCharm) Skip this section if you're staying in VS Code — or do both and decide which home you prefer. The features are nearly identical; the labs in this course call out the differences when they matter. Install the plugin Open Settings → Plugins → Marketplace ( Ctrl+Alt+S on Windows/Linux, Cmd+, on macOS). Search for \"Gemini Code Assist\" (publisher: Google), click Install , and restart the IDE when prompted. Sign in and open the tool window After restart, a Gemini icon appears in the right-hand tool window strip. Click it, choose Sign in with Google , and complete the browser flow — same as VS Code. Open any Python file and type the grams_to_ounces comment from Lab A to confirm ghost text appears. VS Code Chat location Activity Bar panel Agent mode Toggle in chat box MCP config ~/.gemini/settings.json Auto-approve \"yolo mode\" setting JetBrains IDEs Chat location Right tool window Agent mode Agent tab MCP config mcp.json in IDE config dir Auto-approve \"Auto-approve changes\" checkbox Android Studio Android Studio (Narwhal and later) ships Gemini built in — no marketplace install. Open the Gemini tool window, sign in, and you get completion, chat, and agent mode tuned for Android projects. Everything you learn in this course transfers directly."},{"id":"standard-setup","title":"Standard / Enterprise Setup (Teams)","text":"Standard / Enterprise Setup (Teams) Analogy First The free tier is like using a personal library card: you sign up yourself and you're in. A Standard or Enterprise seat is a corporate library card: the company opens an account with the library (a Google Cloud project), buys a block of memberships (license seats), and hands one to each employee (license assignment). The painful failure mode is an employee holding a card the company never activated — you can sign in but every request is rejected. The three steps below are exactly: open the account, buy the seats, hand them out. Technical Definition Standard and Enterprise are licensed through a Google Cloud project The basic organizational unit in Google Cloud. Billing, APIs, and permissions all attach to a project. You identify one by its globally unique project ID. . An admin must, once per organization: Enable the Gemini for Google Cloud API ( cloudaicompanion.googleapis.com ) in the project. Purchase a Standard or Enterprise subscription in the Gemini admin console and assign license seats to users. Grant each developer the \"Gemini for Google Cloud User\" IAM role ( roles/cloudaicompanion.user ) on that project. Admins can do all three from the console UI, or script it: gcloud — admin one-time setup Copy # 1. Enable the API (replace my-team-project with your project ID) gcloud services enable cloudaicompanion.googleapis.com --project my-team-project # 2. Grant a developer the required role gcloud projects add-iam-policy-binding my-team-project ` --member=\"user:dev@example.com\" ` --role=\"roles/cloudaicompanion.user\" # (License seats are assigned in Console: Gemini admin page -> Subscriptions) Then each developer does one extra step in the IDE: after signing in, select the licensed Google Cloud project when the extension asks (VS Code: click the project name in the status bar or run the command \"Gemini: Select Google Cloud project\" from the palette). Gotcha \"It works at home but not on my work account\" is almost always one of: the API isn't enabled on the selected project, the IAM role is missing, or the IDE is pointed at the wrong project (e.g., your personal sandbox instead of the licensed one). Check those three in that order — it resolves the vast majority of cases."},{"id":"troubleshooting","title":"Troubleshooting","text":"Troubleshooting No ghost text appears. Confirm the file type is a recognized language (e.g., .py , not .txt ); check the status bar Gemini icon for an error badge; make sure inline suggestions aren't disabled ( editor.inlineSuggest.enabled in VS Code settings); and verify another AI assistant (e.g., Copilot) isn't capturing completions first — run one assistant at a time. Sign-in loop / browser never returns. Corporate proxies and SSO can block the localhost callback. Try signing in from the browser the IDE opened (not a copied URL), and whitelist accounts.google.com . \"Quota exceeded\" messages. Free-tier daily limits reset every 24h. Teams: confirm the license seat is actually assigned, not just the IAM role. Suggestions are slow. Completions are cloud-generated; check your connection. JetBrains users: disable other completion-heavy plugins for a fair test. Behind a firewall. The extension needs HTTPS access to *.googleapis.com . Ask IT to allow it; there is no offline mode. What Just Happened? You installed the extension, signed in, generated and verified your first AI-written function, and (if you're on a team) learned the three-step admin flow that powers licensed seats. The tool is live — from here on, every module is about using it well."},{"id":"quiz","title":"Knowledge Check","text":"Knowledge Check 1. Ghost text just appeared in your editor. What is it, right now? Code that has already been added to your file and saved A preview of a suggestion — it only becomes real code when you accept it (Tab) A syntax error highlight A comment generated by the linter 2. Which THREE things must an admin set up for a Standard/Enterprise developer seat to work? Install Docker, create a VM, open port 443 Enable the Gemini for Google Cloud API, assign a license seat, grant roles/cloudaicompanion.user Buy a domain, configure DNS, issue certificates Nothing — any Google account automatically gets Standard features 3. The comment you write before triggering a generation matters because… Comments are required syntax for completions to trigger The model reads it as your intent — requirements you state (rounding, error handling) show up in the generated code Longer comments make responses faster Comments are stripped before being sent, so they don't matter 4. After accepting a generated function, the recommended next step is to… Commit immediately — generated code is pre-verified by Google Delete the comment that produced it Read it and run it — suggestions are drafts and you own their correctness Regenerate it at least three times 5. Your work IDE shows \"quota exceeded\" but your IAM role is correct. The most likely cause is… Your IDE is out of date No license seat is assigned to your account (the role alone isn't a license), or the IDE points at an unlicensed project Gemini models are offline globally Your GEMINI.md file is too large Quiz Complete! Ready for G02: Code Completion & Generation → ← Previous G00: Orientation Next → G02: Code Completion & Generation"}]},{"file":"G02-code-completion.html","title":"G02: Code Completion & Generation","sections":[{"id":"how-completion-works","title":"Code Completion & Generation","text":"Code Completion & Generation In G01 you saw one suggestion. In this module you'll understand why suggestions look the way they do — and use that understanding to steer them, building Recipe Box's storage layer from comments alone. How Completion Actually Works Analogy First Think of a session musician who joins your band mid-song. They don't ask what to play — they listen to the bars you've already played (what's before the cursor), glance at the chord chart on the stand (your other open files), notice where the song is heading (what's after the cursor), and improvise the next phrase in your style. A musician who only heard the last two notes would play something generic; the more of your song they hear, the more the phrase sounds like yours . Code completion works identically: the model reads the code around your cursor and your related files, then predicts what a competent developer would write next in this exact project . That's why the same keystrokes produce different suggestions in different files. Technical Definition On each pause in typing, the extension assembles a prompt context The bundle of text sent to the model: code before the cursor (prefix), code after it (suffix), the file path and language, and snippets from related open files. — the prefix (code before your cursor), the suffix (code after it), and relevant content from other open tabs — and asks a fast Gemini model to fill in the middle A model technique where the AI generates text that fits between a given beginning and end, rather than only continuing from the end. This is why suggestions respect the code below your cursor. . The result renders as ghost text. Nothing is inserted until you accept. Two consequences worth memorizing: (1) Your file is the prompt. Names, comments, and nearby code steer the output more than anything else. (2) Open tabs matter. Keeping the relevant model/schema file open in another tab measurably improves suggestions in the file you're editing. Why It Matters Developers who treat completion as random magic accept ~30% of suggestions and rage-quit the rest. Developers who know \"my file is the prompt\" rename a variable, add one clarifying comment, or open the schema file in a second tab — and acceptance quality jumps. Same tool, different mental model, very different week."},{"id":"comment-driven","title":"Comment-Driven Generation","text":"Comment-Driven Generation Completion's big sibling: instead of finishing your line, the model writes a whole function from a comment that states your intent. The skill is writing comments that read like a mini-specification , not a vague wish. ✗ Vague comment → generic code # save recipe def save_recipe( No types, no storage choice, no failure behavior. The model must guess all three — and its guesses may not match your project. ✓ Spec comment → your code # Insert a recipe dict (name, ingredients list, # minutes int) into the SQLite 'recipes' table. # Return the new row id. Raise StorageError on # any sqlite3 error, never expose raw exceptions. def save_recipe( Data shape, storage, return value, and error policy are all stated — so they all appear in the generated code. The Spec-Comment Formula A reliable generation comment answers four questions: WHAT does the function do (one verb phrase), with WHICH inputs/outputs (names and types), using WHERE (the library/store/API it should touch), and WHAT-IF (the failure behavior). Write those four and the model rarely surprises you."},{"id":"shortcuts","title":"Controls & Shortcuts","text":"Controls & Shortcuts You'll use these constantly — learn them now so the lab flows: Action VS Code JetBrains Accept full suggestion Tab Tab Accept next word only Ctrl + → Alt + → (varies by keymap) Dismiss suggestion Esc Esc Cycle alternatives Alt + ] / Alt + [ hover popup arrows Open Gemini chat Ctrl + Alt + G (or click ✦) Gemini tool window Gotcha Partial accept is the power move. When a 12-line suggestion is 80% right, don't accept-then-delete: accept word-by-word ( Ctrl + → ) up to the point where it diverges from your intent, then type your correction — the model immediately re-suggests from your correction. This loop — accept, correct, re-suggest — is how experienced users keep their hands on the wheel."},{"id":"lab","title":"Lab: Build Recipe Box's Storage Layer","text":"Lab: Build Recipe Box's Storage Layer Goal: a working SQLite storage module, storage.py , written ~90% by Gemini from your spec-comments — verified by you at every step. You'll need the recipe-box folder from G01 open in your IDE. Set the stage (this is prompt engineering too) Create storage.py and paste this header. It's not decoration — the docstring and imports tell the model the conventions for everything that follows: storage.py — paste this header Copy \"\"\"SQLite storage layer for Recipe Box. Conventions: - One module-level DB_PATH, default \"recipes.db\". - Every public function opens its own connection (no globals). - All sqlite3 errors are wrapped in StorageError. - Recipes are plain dicts: {\"id\": int, \"name\": str, \"ingredients\": list[str], \"minutes\": int}. \"\"\" import json import sqlite3 DB_PATH = \"recipes.db\" class StorageError(Exception): \"\"\"Raised when any database operation fails.\"\"\" Generate the schema function from a spec-comment Below the class, type this comment and the def line, then pause for ghost text. Read the suggestion against the comment before accepting: storage.py — type, pause, review, Tab Copy # Create the 'recipes' table if it doesn't exist: # id INTEGER PRIMARY KEY AUTOINCREMENT, # name TEXT NOT NULL, ingredients TEXT (JSON-encoded list), # minutes INTEGER NOT NULL CHECK (minutes > 0). # Wrap sqlite3.Error in StorageError. def init_db() -> None: WHAT: a table-creation function. WHY the comment lists exact column types: schema is the one place you never want the model improvising. GOTCHA: if the suggestion stores ingredients without JSON-encoding, reject it and re-trigger — the docstring convention says lists are JSON in a TEXT column. A correct result looks like this (yours may differ in details — that's fine if the contract holds): reference solution Copy def init_db() -> None: try: with sqlite3.connect(DB_PATH) as conn: conn.execute( \"\"\"CREATE TABLE IF NOT EXISTS recipes ( id INTEGER PRIMARY KEY AUTOINCREMENT, name TEXT NOT NULL, ingredients TEXT NOT NULL, minutes INTEGER NOT NULL CHECK (minutes > 0) )\"\"\" ) except sqlite3.Error as err: raise StorageError(f\"init_db failed: {err}\") from err Generate the write path Same technique, two more functions. Type each comment block, review, accept or correct: storage.py — spec comments to type Copy # Insert a recipe and return its new id. # recipe has keys: name (str), ingredients (list[str]), minutes (int). # JSON-encode ingredients. Wrap sqlite3.Error in StorageError. def add_recipe(recipe: dict) -> int: # Return all recipes as a list of dicts (decode ingredients # from JSON). Order by name. Wrap sqlite3.Error in StorageError. def list_recipes() -> list[dict]: ✅ Review checklist before accepting each Does add_recipe use a parameterized query ( ? placeholders, never f-strings — that's SQL injection)? Does it return cursor.lastrowid ? Does list_recipes run json.loads on the ingredients column? Is every sqlite3.Error wrapped? Verify end-to-end Append a self-test and run the module: storage.py — verification harness Copy if __name__ == \"__main__\": init_db() rid = add_recipe({ \"name\": \"Masala Chai\", \"ingredients\": [\"black tea\", \"milk\", \"cardamom\", \"ginger\"], \"minutes\": 10, }) print(f\"inserted id={rid}\") for r in list_recipes(): print(r[\"id\"], r[\"name\"], r[\"ingredients\"], f\"{r['minutes']} min\") try: add_recipe({\"name\": \"Broken\", \"ingredients\": [], \"minutes\": -3}) except StorageError as err: print(f\"correctly rejected bad data: {err}\") terminal — expected run PS> python storage.py inserted id=1 1 Masala Chai ['black tea', 'milk', 'cardamom', 'ginger'] 10 min correctly rejected bad data: add_recipe failed: CHECK constraint failed: minutes > 0 ✦ ~40 lines of working, error-handled code — you typed 12 lines of comments ▶ ▮▮ ↻ Press ▶ to see the expected output Optional: do it in Node.js Same technique, different language — create storage.mjs , paste a header docstring describing the same conventions (use better-sqlite3 or node:sqlite ), and generate initDb / addRecipe / listRecipes from comments. Notice that your spec-comment skills transfer unchanged: the four questions (WHAT/WHICH/WHERE/WHAT-IF) are language-agnostic. What Just Happened? You built a real storage module by writing specifications instead of implementations — and you reviewed every line before it entered your codebase. The header docstring acted as standing instructions (a taste of what GEMINI.md does project-wide in G05), the spec-comments controlled each function, and the self-test caught anything that slipped through. This write→review→verify loop is the foundation for everything ahead."},{"id":"when-not","title":"When Completion Hurts","text":"When Completion Hurts An honest tool guide tells you where the tool is weak. Completion is the wrong instrument when: You don't yet know what you want. Ghost text will happily commit you to the first plausible idea. Think first, or use chat (G03) to explore options. The code is security-critical. Auth, crypto, payment logic: write it deliberately, use completion only for boilerplate, and review like an adversary. The API is newer than the model's knowledge. Suggestions may use renamed or deprecated calls. Trust your compiler/tests over ghost text, and feed current docs via context files (G05). You're learning a concept. If the goal is for you to learn recursion, accepting a perfect recursive function teaches you nothing. Disable suggestions temporarily (click the Gemini status bar icon → pause) — the tool should serve the goal, not replace it. Why It Matters Studies of AI-assisted teams consistently find the productivity win comes with a code-review tax: more code gets written, so more code must be reviewed. Teams that skip the review step ship subtle bugs at a higher rate than before they had AI. The discipline you practiced in this lab — checklist-review before accepting — is what keeps you in the winning column."},{"id":"quiz","title":"Knowledge Check","text":"Knowledge Check 1. What does the extension send to the model when generating an inline completion? Only the current line Code before AND after the cursor, plus relevant content from other open files Your entire hard drive Nothing — completions are computed locally without context 2. Which spec-comment element was responsible for the CHECK constraint appearing in init_db ? Explicitly stating \"minutes INTEGER NOT NULL CHECK (minutes > 0)\" in the comment The model always adds CHECK constraints automatically The DB_PATH constant Luck — generation is random 3. A 12-line suggestion is right until line 8, then wrong. Best workflow? Accept all 12 lines, then delete and rewrite the bad part Dismiss everything and write all 12 lines by hand Accept word-by-word to the divergence point, type your correction, let it re-suggest from there File a bug report with Google 4. In the lab's review checklist, why insist on parameterized queries ( ? placeholders)? They run faster than f-strings Building SQL with f-strings allows SQL injection; placeholders keep data and query separate SQLite refuses to execute f-string queries Placeholders are required for JSON columns 5. When is it smart to pause completions entirely? Never — more suggestions are always better When you're deliberately learning a concept, or writing security-critical logic you must reason through yourself Whenever you write Python Only when offline Quiz Complete! Ready for G03: Chat, Smart Commands & Actions → ← Previous G01: Setup & First Suggestion Next → G03: Chat & Smart Commands"}]},{"file":"G03-chat-smart-commands.html","title":"G03: Chat, Smart Commands & Smart Actions","sections":[{"id":"chat-panel","title":"Chat, Smart Commands & Smart Actions","text":"Chat, Smart Commands & Smart Actions Completion (G02) answers \"what comes next?\". Chat answers everything else: \"why is this broken?\", \"how does this work?\", \"what's a better way?\". This module is about asking well. The Chat Panel: A Conversation That Sees Your Code Analogy First Asking a coding question on a generic chatbot website is like phoning a help desk: before they can help, you must read your code aloud, describe your project, and explain what you already tried — and the moment you hang up, they forget you. It's slow, and the costliest part is the copy-paste shuttle where context gets lost. The IDE chat panel is a colleague standing at your desk, looking at your screen : \"why does this function fail?\" works, because they can see which function you mean, what file it's in, and what the rest of the project looks like. No reading aloud, no shuttle, no amnesia within the conversation. Technical Definition The Gemini Code Assist chat panel (VS Code: Activity Bar ✦ icon; JetBrains: right tool window) is a conversational interface whose prompts are automatically enriched with IDE context : your active file, selected text, and — with codebase awareness (Standard/Enterprise, G05) — relevant files from the whole project. You can also attach specific files explicitly via the context controls (the + / paperclip control in the chat box, or by referencing open editors). Conversations are sessions : each chat keeps its own history and context. Both IDEs let you create multiple chats (e.g., one debugging thread, one architecture thread) and switch between them — context in one doesn't bleed into another. In IntelliJ, chats survive restarts; in VS Code, history is available per workspace. Why It Matters The copy-paste shuttle isn't just slow — it's lossy and risky. Pasting internal code into consumer chatbots is a data-leak vector that security teams ban outright (Samsung famously did after engineers pasted proprietary code into a public chatbot in 2023). In-IDE chat keeps code inside your licensed, governed channel and answers with your real project in view. Faster and safer is a rare combination; use it. Three habits that make chat answers dramatically better Select before you ask. Highlighting the relevant lines pins the model's attention. \"Why can this return None?\" with a selection beats a paragraph of description. One thread per topic. Start a new chat when you change topics. A debugging thread polluted with naming-convention questions gives worse answers to both. Paste the evidence. Error message, stack trace, failing test output — verbatim. The model is excellent at reading tracebacks; don't paraphrase them."},{"id":"smart-commands","title":"Smart Commands: Slash Shortcuts for Routine Asks","text":"Smart Commands: Slash Shortcuts for Routine Asks Technical Definition Smart commands are built-in slash commands typed in the chat box. Each one wraps a well-engineered prompt around your current file or selection — so you get consistent, high-quality results for the most common requests without writing the prompt yourself. Command What it does Pro tip /explain Explains the selected code or current file in plain language Add a focus: /explain the error handling path /fix Diagnoses and proposes fixes for errors in the selection/file Select the failing code AND paste the error message /generate Generates code from a description, into chat or at the cursor Use the spec-comment formula from G02 in your description /doc Writes documentation (docstrings, comments) for the selection Tell it the style: /doc using Google-style docstrings /simplify Rewrites the selection to be cleaner and more readable Great first pass before a human code review Gotcha Slash commands operate on what the IDE considers current context — usually your selection, or the active file if nothing is selected. Running /fix with the wrong file focused produces confident fixes for code that was never broken. Glance at the context indicator in the chat box before you hit Enter."},{"id":"smart-actions","title":"Smart Actions: Right-Click and Lightbulb","text":"Smart Actions: Right-Click and Lightbulb Technical Definition Smart actions are the same capabilities surfaced where your mouse already is: select code → right-click → Gemini Code Assist submenu ( Explain this , Generate unit tests , Fix , …). When the editor detects a problem, a lightbulb quick-fix The 💡 icon IDEs show next to a line with a detected issue. Clicking it lists automated fixes — Gemini adds AI-powered ones to that list. may also offer a Gemini fix inline. Same engine as smart commands — different doorway. When to reach for which: Smart action (right-click): you're mid-edit, hands on mouse, want a one-shot answer about this code. Smart command (slash): you're already in a chat thread and want the result to join that conversation's context. Free-form chat: the ask doesn't fit a template — trade-off questions, \"what are my options?\", architecture reasoning."},{"id":"citations","title":"Source Citations","text":"Source Citations Technical Definition When a suggestion directly quotes at length from a known open-source repository , Gemini Code Assist shows a source citation naming the origin (and license, when known) in chat responses and the citation log. Admins can also configure blocking of matched suggestions entirely. Note: citations are not available in agent mode (G06) — a real trade-off to know about. Why It Matters If a 40-line block lands in your proprietary codebase verbatim from a GPL project, you have a license-compliance problem that no amount of velocity justifies. Citations turn \"did the AI copy this?\" from an unanswerable anxiety into a reviewable event — and on Standard/Enterprise, Google additionally offers IP indemnification (G11). When you see a citation badge: stop, check the license, and decide deliberately."},{"id":"lab","title":"Lab: Fix Recipe Box's Broken API","text":"Lab: Fix Recipe Box's Broken API Recipe Box gets its web layer today — but the version below ships with three planted bugs . You'll use /explain , /fix , and /doc to find, fix, and document them. First, install Flask: terminal Copy pip install flask Create the broken app.py Paste this into a new app.py in your recipe-box folder. Yes, it's broken on purpose — don't fix it by eye yet: app.py — contains 3 planted bugs Copy from flask import Flask, jsonify, request import storage app = Flask(__name__) storage.init_db() @app.route(\"/recipes\", methods=[\"GET\"]) def get_recipes(): recipes = storage.list_recipes() return jsonify(recipes) @app.route(\"/recipes\", methods=[\"GET\"]) # BUG ? def create_recipe(): data = request.get_json() recipe = { \"name\": data[\"name\"], # BUG ? \"ingredients\": data[\"ingredients\"], \"minutes\": data[\"minutes\"], } new_id = storage.add_recipe(recipe) return jsonify({\"id\": new_id}), 200 # BUG ? if __name__ == \"__main__\": app.run(debug=True, port=5001) WHAT: a two-endpoint Flask API over the storage module you built in G02. WHY it's broken: real debugging practice beats toy examples — these are three of the most common real-world API mistakes. GOTCHA: one bug prevents startup, one crashes on bad input, one is silently wrong but \"works\". Let the error message lead: run it terminal Copy python app.py It crashes immediately with an AssertionError about overwriting an existing endpoint. Select the whole file, open chat, and run: chat Copy /fix AssertionError: View function mapping is overwriting an existing endpoint function: get_recipes ✅ Expected Gemini identifies that both routes declare methods=[\"GET\"] on the same path — the create endpoint must be methods=[\"POST\"] . Apply the fix (use the response's insert/copy controls or edit by hand) and re-run. The server should now start on port 5001. Hunt the crash-on-bad-input bug With the server running, send a request that's missing a field (new terminal): terminal — works on PowerShell 7+ / bash (curl) Copy curl -X POST http://localhost:5001/recipes -H \"Content-Type: application/json\" -d \"{\\\"name\\\": \\\"Toast\\\"}\" You get an ugly 500 with a KeyError traceback in the server log. Select the create_recipe function and ask: chat Copy /fix this returns a 500 KeyError when fields are missing. It should validate the JSON body and return a 400 with a helpful message listing missing fields. ✅ Expected A version that checks request.get_json(silent=True) , validates that name , ingredients , and minutes exist (and have sane types), and returns jsonify({\"error\": ...}), 400 when they don't. Re-run the curl — you should now get a clean 400 JSON error, and the server log stays traceback-free. Find the silent bug with /explain One bug remains and nothing crashes. Select create_recipe 's final return line and run: chat Copy /explain what HTTP status code should a successful resource creation return, and is this code following that convention? ✅ Expected Gemini explains that REST convention for a successful creation is 201 Created , not 200, and points at your return ..., 200 . Change it to 201 . Silent-but-wrong is the most dangerous bug class — /explain as a convention-checker is one of chat's most underrated uses. Document the fixed file with /doc Select the whole file and run: chat Copy /doc add a module docstring and Google-style docstrings for each route, including the status codes each can return ✅ Final verification Re-run python app.py , then: curl http://localhost:5001/recipes returns your Masala Chai from G02; a valid POST returns 201 with a new id; an invalid POST returns 400 with a message. All three? Lab complete. What Just Happened? You debugged three different bug species with three different tools: an error-message bug with /fix + pasted traceback, an input-validation bug with /fix + a described requirement, and a silent convention bug with /explain as an auditor. Then /doc captured the knowledge into the file. Notice you never paraphrased an error — you fed evidence verbatim. That habit alone will save you hours."},{"id":"quiz","title":"Knowledge Check","text":"Knowledge Check 1. What makes IDE chat fundamentally different from a chatbot website? It uses a bigger model Prompts are automatically enriched with your real code context (active file, selection, project), and code stays in a governed channel It works offline It can only answer questions about syntax 2. You want a clean rewrite of a gnarly function before sending it to human review. Best smart command? /doc /explain /simplify /generate 3. The lab's two /fix calls worked well because you… Provided evidence: the verbatim error in one case, a precise description of wrong behavior + desired behavior in the other Used the word \"please\" Ran them twice each Had the premium model selected 4. A suggestion arrives with a source citation badge naming a GPL-licensed repository. You should… Accept it — citation means it's pre-approved Stop and evaluate: a long verbatim GPL excerpt in proprietary code is a license-compliance decision, not an autocomplete decision Delete the whole file Citations only appear for Google-owned code 5. Why keep separate chat threads for separate topics? Each thread is billed separately Each chat's history is context for its next answer — mixed topics pollute that context and degrade answers on both topics Threads can't exceed 10 messages It's required by the license terms Quiz Complete! Ready for G04: Refactoring, Tests & Debugging → ← Previous G02: Code Completion & Generation Next → G04: Refactoring, Tests & Debugging"}]},{"file":"G04-refactoring-testing.html","title":"G04: Refactoring, Test Generation & Debugging","sections":[{"id":"transformations","title":"Refactoring, Test Generation & Debugging","text":"Refactoring, Test Generation & Debugging G03 taught the conversation tools. This module points them at the two chores developers postpone forever — refactoring and writing tests — and shows how to delegate the labor while keeping the judgment. Code Transformations Analogy First A house renovation has two distinct jobs: the architect decides \"this wall should move,\" and the crew swings the hammers. Most developers are forced to be both — they know the function should take a config object instead of seven positional arguments, but actually threading that change through every call site is an afternoon of careful drudgery. So the wall never moves, and the codebase slowly becomes a maze. Code transformations split the jobs back apart: you stay the architect (\"extract this into smaller functions, add type hints, handle the error cases\"), and Gemini becomes the crew — with the crucial twist that you inspect every swing of the hammer as a diff before it touches the house. Technical Definition Code transformations are edits requested in natural language against existing code: select code, then ask in chat (or via right-click smart actions) for things like: Restructuring: \"extract the validation into its own function\", \"convert this class to a dataclass\" Hardening: \"add error handling for network failures\", \"add type hints everywhere\" Modernizing: \"rewrite for Python 3.12 idioms\", \"migrate from requests to httpx\" Renaming & readability: \"rename these variables to describe their purpose\" In current VS Code and IntelliJ builds, chat proposes changes in a preview/diff view — added lines green, removed lines red — that you apply or reject. The behavioral rule for all refactoring applies doubly with AI: behavior stays identical; only structure improves. Tests are how you prove it, which is why this module teaches both together."},{"id":"test-generation","title":"Unit Test Generation","text":"Unit Test Generation Analogy First Writing tests for your own code is like proofreading your own essay: you read what you meant , not what you wrote, so your blind spots survive. A fresh reader catches what you can't — not because they're smarter, but because they don't share your assumptions. Generated tests are that fresh reader at scale: the model reads your function's actual contract (signature, docstring, branches) and probes it, including the negative paths you mentally skipped — empty lists, negative numbers, the exception you declared but never tested. Technical Definition Select a function/class → right-click → Gemini Code Assist → Generate unit tests (or ask in chat). Gemini infers the testing framework from your project (pytest if it sees pytest, JUnit in Java projects, Jest in JS) and produces test cases covering happy paths, edge cases, and declared exceptions. Generated tests are proposals : they encode the model's reading of your contract, and where that reading differs from your intent, you've found either a test to fix or — more interestingly — a bug or unclear API in your code. Why It Matters Teams that \"never have time for tests\" are the exact teams drowning in regressions that eat the time they saved. Test generation drops the cost of a first test suite from days to minutes — Recipe Box's storage layer gets ~10 meaningful tests in this lab in under 15 minutes. Once the suite exists, every future refactor (and every agent-mode change in G06) has a safety net, and the net was nearly free."},{"id":"lab-refactor","title":"Lab Part 1: Refactor Legacy Search Code","text":"Lab Part 1: Refactor Legacy Search Code A \"previous developer\" left Recipe Box a working-but-awful search function. Your job: make it clean without changing behavior . Add the legacy code Create search.py and paste: search.py — intentionally awful Copy import storage def s(q, mx, f): r = storage.list_recipes() o = [] for x in r: ok = 0 if q != None and q != \"\": if q.lower() in x[\"name\"].lower(): ok = 1 else: for i in x[\"ingredients\"]: if q.lower() in i.lower(): ok = 1 else: ok = 1 if ok == 1: if f == 1: if x[\"minutes\"] <= 30: o.append(x) else: o.append(x) if mx != None and mx > 0: o = o[0:mx] return o WHAT: search by name/ingredient, optional \"fast recipes only\" filter ( f == 1 means ≤30 minutes), optional result cap. WHY it's painful: single-letter names, flag-as-int, != None , five levels of nesting. It works — that's the point. Refactoring is for working code. Understand before you touch (the professional's rule) Select the whole function and run /explain . Read the answer and confirm it matches the annotation above. Never refactor code you can't describe — with or without AI. Direct the transformation With the function still selected, give the architect's instruction in chat: chat Copy Refactor this function. Keep behavior identical. Requirements: 1. Rename it search_recipes with descriptive parameter names (query, max_results, quick_only) and full type hints; quick_only is a bool. 2. Extract the \"does this recipe match the query\" logic into a helper function _matches(recipe, query). 3. Flatten the nesting with early returns / continue. 4. Add a Google-style docstring stating the quick_only threshold (30 minutes). ✅ Review the diff before applying Same matching rules? (case-insensitive, name OR any ingredient, empty/None query matches everything.) Same cap semantics? ( max_results=None or ≤0 means unlimited.) If the proposal \"improved\" any behavior — e.g., made empty query return nothing — reject that hunk and say so: \"keep the empty-query-matches-all behavior.\" Prove behavior survived Append and run a quick harness (your G02 data is still in recipes.db ): search.py — harness Copy if __name__ == \"__main__\": print(len(search_recipes(None, None, False))) # all recipes print(len(search_recipes(\"chai\", None, False))) # name match: 1 print(len(search_recipes(\"cardamom\", None, False)))# ingredient match: 1 print(len(search_recipes(\"pizza\", None, False))) # no match: 0 print(len(search_recipes(None, None, True))) # only quick (<=30 min)"},{"id":"lab-tests","title":"Lab Part 2: Generate a Real Test Suite","text":"Lab Part 2: Generate a Real Test Suite Install pytest and generate terminal Copy pip install pytest Open storage.py , select all of it, right-click → Gemini Code Assist → Generate unit tests (or in chat: \"Generate pytest tests for this module, covering init_db, add_recipe, list_recipes, including StorageError paths and the minutes > 0 constraint\" ). Save the result as tests/test_storage.py . Run them — and expect trouble terminal Copy pytest tests/ -v pytest — typical first run PS> pytest tests/ -v tests/test_storage.py::test_init_db_creates_table PASSED tests/test_storage.py::test_add_recipe_returns_id PASSED tests/test_storage.py::test_list_recipes_empty FAILED AssertionError: assert 3 == 0 — expected empty DB, found 3 recipes tests/test_storage.py::test_add_recipe_invalid_minutes FAILED Diagnosis: every test hits the REAL recipes.db from G02... ✦ The tests aren't wrong. The module is hard to test. That's the finding. ▶ ▮▮ ↻ Press ▶ to see the typical first run The Classic Failure (read this even if your tests passed) Generated tests often fail at first — and the cause is usually a testability flaw in your code , not in the tests. Here: storage.py hardcodes DB_PATH = \"recipes.db\" , so tests pollute (and are polluted by) your real database. The generated suite just exposed a design smell you'd have hit eventually in production. Fix the design, not the symptom Ask Gemini to make it right. In chat, with tests/test_storage.py open and storage.py in another tab: chat Copy These tests fail because storage.py hardcodes DB_PATH and all tests share my real recipes.db. Write a pytest fixture (conftest.py) that points storage at a temporary database per test using tmp_path and monkeypatch, and update the tests to use it. The expected shape of the fix: tests/conftest.py — reference solution Copy import pytest import storage @pytest.fixture(autouse=True) def temp_db(tmp_path, monkeypatch): \"\"\"Point storage at a fresh database file for every test.\"\"\" monkeypatch.setattr(storage, \"DB_PATH\", str(tmp_path / \"test.db\")) storage.init_db() yield ✅ Expected pytest tests/ -v now shows all green — typically 8–12 passing tests covering inserts, listing order, JSON round-tripping of ingredients, the minutes > 0 constraint, and StorageError wrapping. Commit this suite mentally: G06's agent will be graded against it. What Just Happened? Part 1: you acted as architect and reviewed the crew's diff — behavior preserved, structure transformed. Part 2: generated tests failed usefully , exposing a real testability flaw (hardcoded DB path), and the fix — a standard pytest fixture — made both the tests and the module better. This is the mature pattern: AI output failures are often information about your code , not noise."},{"id":"debugging","title":"The Debugging Workflow, Assembled","text":"The Debugging Workflow, Assembled You've now used every piece. Here's the loop to internalize, in order of escalation: Reproduce — get the exact error text or wrong output. (No evidence, no debugging.) /explain the suspect code — confirm what it actually does vs. what you assumed. A surprising number of bugs die right here. /fix with evidence — selection + verbatim error + expected behavior. Apply via diff, then re-run — the failing test or curl from step 1 is your referee. Lock it in with a test — \"write a pytest test that would have caught this bug.\" Now the bug can never return silently. Why It Matters Step 5 is the compounding one. A fixed bug saves you once; a regression test for it saves you every release forever. Since generated tests cost minutes, the old excuse (\"no time to write a test for every fix\") is gone — and a codebase where every past bug has a guard test is the codebase you can safely hand to agent mode next module."},{"id":"quiz","title":"Knowledge Check","text":"Knowledge Check 1. The golden rule of refactoring (AI-assisted or not) is… Always reduce the line count Behavior stays identical; only structure improves — and tests prove it Rename everything to longer names Refactor and add features in the same change to save time 2. In the lab, the generated tests failed at first because… Gemini generated syntactically invalid tests pytest was the wrong framework storage.py hardcoded its database path, so tests collided with the real recipes.db — a testability flaw in the code under test SQLite can't be used in tests 3. Before applying a refactoring diff, the single most important check is… That the new code is shorter That no behavior changed — including edge-case semantics like \"empty query matches everything\" That variable names are alphabetical That it uses the newest language features 4. What did the conftest.py fixture accomplish? It made tests run in parallel Every test gets its own fresh temporary database via monkeypatched DB_PATH — isolating tests from each other and from real data It deleted recipes.db permanently It disabled the failing tests 5. After fixing any bug, the compounding final step is… Writing a postmortem document Refactoring the whole module Generating a regression test that would have caught the bug, so it can never silently return Switching to a different model Quiz Complete! Ready for G05: Context Mastery — GEMINI.md & .aiexclude → ← Previous G03: Chat & Smart Commands Next → G05: Context Mastery"}]},{"file":"G05-context-gemini-md.html","title":"G05: Context Mastery — GEMINI.md & .aiexclude","sections":[{"id":"context-layers","title":"Context Mastery: GEMINI.md & .aiexclude","text":"Context Mastery: GEMINI.md & .aiexclude G02's key insight was \"your file is the prompt.\" This module scales that up: your project is the prompt — and you get to decide exactly what's in it, what rules govern it, and what must never leave your machine. The Context Layers Analogy First A new contractor walks onto your job site. What they know arrives in layers: what they can see standing there (the room they're in), the blueprints for the whole building, the site rulebook taped to the wall (\"hard hats always, no welding after 6pm\"), and a locked office they're explicitly not allowed to enter. Remove any layer and you get predictable failures — no rulebook means every contractor improvises their own standards; no locked office means your payroll files end up in a stranger's truck. Gemini Code Assist has exactly these four layers, and by the end of this module you'll control all of them. 1 Cursor context Code around your cursor + open tabs (always on — G02) 2 Codebase awareness Relevant files from the whole project, found for you (this module) 3 GEMINI.md rules Standing instructions loaded into every request (this module) ✗ .aiexclude Files that must NEVER enter any layer (this module)"},{"id":"codebase-awareness","title":"Local Codebase Awareness","text":"Local Codebase Awareness Technical Definition Local codebase awareness means Gemini Code Assist doesn't limit itself to open files: when you ask a question or request a change, it retrieves the relevant files from your whole workspace and includes them in the prompt, leaning on Gemini's 1M-token context window . It's how \"where do we validate recipe input?\" gets answered with the actual three locations across app.py and storage.py rather than a guess. Awareness of your full local workspace is a Standard/Enterprise capability; the free tier works from a narrower window (open files + selections). Enterprise's code customization (G11) goes one step further — awareness of your organization's remote private repos , not just the project on disk. Gotcha A million tokens is huge but not infinite, and relevant retrieval beats raw size. Two practical habits: keep your repo tidy (a workspace full of node_modules , build artifacts, and data dumps dilutes retrieval — .gitignore d paths are generally skipped), and for surgical questions still select code or attach the file explicitly — explicit beats inferred every time."},{"id":"gemini-md","title":"GEMINI.md: Standing Rules For Your Project","text":"GEMINI.md: Standing Rules For Your Project Analogy First Every team has a senior engineer who repeats the same review comments forever: \"we use type hints here,\" \"wrap storage errors,\" \"don't return raw dicts from routes.\" Repeating them is the pain — the knowledge exists, but it lives in one person's head and gets re-taught one pull request at a time. GEMINI.md is those review comments written down once and injected into every AI request automatically . The model stops being a talented stranger and starts being a teammate who's read your team's handbook — because now there is one, and it's three paragraphs of Markdown. Technical Definition GEMINI.md is a free-form Markdown file of project facts and rules that Gemini Code Assist automatically loads as system-level context. Placement: Project: GEMINI.md at the project root (VS Code also honors them in subdirectories — deeper files refine broader ones for code in that subtree) Global: ~/.gemini/GEMINI.md — your personal rules across all projects (VS Code) IntelliJ: GEMINI.md at the project root It is shared by chat, agent mode (G06–G07), and Gemini CLI (G08) — one rulebook, three surfaces. There's no fixed schema: write what a new senior hire would need on day one, in the order they'd need it. Why It Matters Without rules, you correct the same AI mistake daily — suppose a correction costs 90 seconds and you make 10 AI requests a day where conventions matter: that's 15 minutes/day of re-explaining, ~60 hours/year, per developer. A GEMINI.md takes 20 minutes to write once and applies to every request from every teammate who clones the repo (commit it!). It's the single highest-leverage file in this course."},{"id":"aiexclude","title":".aiexclude: Keeping Secrets Out of Prompts","text":".aiexclude: Keeping Secrets Out of Prompts Technical Definition .aiexclude is a file (project root, or deeper directories for scoped rules) using .gitignore syntax One pattern per line: exact names (secrets.json), wildcards (*.pem), directory paths (config/keys/). A pattern matches files relative to the .aiexclude file's location. that blocks matching files from all Gemini Code Assist context: completions, chat, codebase awareness, and agent mode. An empty .aiexclude blocks everything in its directory and below. Difference from .gitignore : gitignore controls what enters version control ; aiexclude controls what enters AI prompts . You usually want both — but they are not interchangeable. A checked-in customer_data/ folder belongs in version control AND out of prompts. .aiexclude — a realistic example Copy # Credentials and keys — never in any prompt .env .env.* *.pem *.key service-account*.json # Real data — privacy, not secrecy customer_exports/ *.sqlite recipes.db # Vendored code — noise that dilutes retrieval vendor/ Why It Matters — the uncomfortable version Without exclusions, a completion triggered inside config.py can legitimately include your .env contents in the prompt context — that's the tool working as designed, reading \"related files.\" Your API keys then transit to the model along with everything else. Standard/Enterprise contractually exclude your prompts from training, so this isn't \"Google learns your keys\" — but your security team is still right to demand that credentials never leave the machine at all. .aiexclude is how you honor that, mechanically, for every current and future teammate."},{"id":"lab","title":"Lab: Prove That Rules Change Output","text":"Lab: Prove That Rules Change Output This lab is an experiment with a control group: same prompt, before and after GEMINI.md. You'll see the difference with your own eyes — the most convincing demo in this course. Baseline: ask without rules In chat (no selection), run this exact prompt and save the answer (paste it into a scratch file): chat — baseline prompt Copy Add a DELETE /recipes/<id> endpoint to app.py Typical baseline output: a working route, but with choices the model had to invent — maybe raw dict returns, maybe no 404 handling, maybe inline SQL instead of a storage function. Note its choices; they're about to change. Write Recipe Box's GEMINI.md Create GEMINI.md at the project root: GEMINI.md Copy # Recipe Box — Project Context ## What this is A Flask + SQLite recipe API. Entry point: app.py (port 5001). Storage layer: storage.py — ALL database access goes through it. Search: search.py. Tests: tests/ (pytest, temp-DB fixture in conftest.py). ## Architecture rules - Routes never touch sqlite3 directly. Add storage functions instead. - Every route validates input and returns JSON errors: {\"error\": \"...\"} with a correct status (400 bad input, 404 missing). - Successful creation returns 201; successful deletion returns 204. - All storage functions wrap sqlite3.Error in StorageError. - Type hints on every function. Google-style docstrings on public ones. ## Testing rules - Every new storage function and route gets pytest tests. - Tests use the temp-DB fixture — never the real recipes.db. ## Never do - Never use f-strings to build SQL (parameterized queries only). - Never return hashed/internal fields to clients. - Never add a dependency without flagging it explicitly. WHAT: facts (what/where), rules (how), prohibitions (never). WHY this structure: facts prevent wrong guesses, rules encode your conventions, \"never\" lines guard the dangerous edges. GOTCHA: keep it under ~150 lines — it rides along with every request, and a rambling rulebook dilutes its own signal. Re-run the experiment Start a new chat (fresh context — this matters: old chats may not reload rules) and run the identical prompt: chat — same prompt, new chat Copy Add a DELETE /recipes/<id> endpoint to app.py ✅ Compare against your baseline The after-version should now: route through a new storage.delete_recipe(recipe_id) function (not inline SQL), return 404 with a JSON error for missing ids and 204 on success, carry type hints and a docstring — and likely offer pytest tests because the rules demand them. Count the differences; each one is a correction you'll never have to make by hand again. Add the safety layer Create .aiexclude at the project root, then verify it took effect: .aiexclude Copy .env *.pem recipes.db Create a decoy .env file containing FAKE_API_KEY=test-12345-not-real . In a new chat , ask: \"What environment variables does this project use?\" ✅ Expected Gemini should answer from code references to env vars (if any) but be unable to quote your .env contents — the file is invisible to it. If it names your fake key, check the .aiexclude location (project root) and spelling, reload the window, and retry in a fresh chat. Commit the contract terminal Copy git init git add GEMINI.md .aiexclude app.py storage.py search.py tests/ git commit -m \"Recipe Box with AI context rules and exclusions\" Committing GEMINI.md and .aiexclude makes them team infrastructure : every teammate (and every agent run in G06) inherits the same rules and the same safety rails. You'll also need this git repo for G07 and G09. What Just Happened? You ran a controlled experiment: identical prompt, observably different output, with GEMINI.md as the only variable — proof that rules are real, not placebo. Then you mechanically excluded secrets and committed both files as team infrastructure. Layers 1–4 are now all under your control, which is the prerequisite for what comes next: handing the keys to an agent."},{"id":"quiz","title":"Knowledge Check","text":"Knowledge Check 1. What does local codebase awareness add over G02's cursor context? It makes completions render faster Relevant files from the whole workspace are retrieved into the prompt — not just code near your cursor and open tabs It uploads your repo to GitHub It works without an internet connection 2. Where does a personal, applies-to-all-projects rule file live for VS Code? /etc/gemini/rules.md ~/.gemini/GEMINI.md It must be re-pasted into every chat GEMINI.md files only work per-project 3. .gitignore vs .aiexclude — which statement is correct? They're aliases for the same mechanism gitignore controls version control; aiexclude controls AI prompt context — checked-in sensitive data needs aiexclude specifically aiexclude replaces gitignore entirely aiexclude only works for .env files 4. Why did the lab insist on a NEW chat after creating GEMINI.md? An existing chat's context was assembled earlier — a fresh chat guarantees the rules are loaded for a clean comparison Old chats are deleted when GEMINI.md changes Chats have a 10-message limit No reason — it was stylistic 5. Which content belongs in GEMINI.md rather than in each prompt? Today's specific error message The code you're currently editing Stable facts and conventions that apply to every request: architecture rules, status-code policy, testing requirements, \"never do\" list Your API keys, so the model can use them Quiz Complete! Ready for G06: Agent Mode I — Delegating Multi-File Work → ← Previous G04: Refactoring & Testing Next → G06: Agent Mode I"}]},{"file":"G06-agent-mode-basics.html","title":"G06: Agent Mode I — Delegating Multi-File Work","sections":[{"id":"what-is-agent","title":"Agent Mode I: Delegating Multi-File Work","text":"Agent Mode I: Delegating Multi-File Work Everything so far was conversation: you ask, it answers, you apply. Agent mode flips the relationship — you state an outcome, and the AI does the work: reading files, planning, editing across the codebase, and running commands. Your job changes from typist to reviewer. What Agent Mode Is Analogy First Chat is asking a brilliant consultant questions across a desk: they advise, you do. Agent mode is handing a competent junior engineer a ticket: \"add tagging to recipes — storage, API, search, tests.\" They go off, read the codebase, come back with a plan (\"I'll touch these five files, in this order\"), and then do the work — showing you each change for sign-off, asking before running anything on your machine. The pain agent mode removes isn't thinking — chat already helped there — it's the orchestration : holding seven coordinated edits in your head and applying them in the right order without dropping one. The junior never gets tired, never forgets file four, and shows receipts for everything. Technical Definition Agent mode is the agentic Operating as an agent: pursuing a goal through multiple self-directed steps — reading files, making edits, invoking tools — rather than producing a single response. mode of Gemini Code Assist chat. Given a task, the agent can: Read your project (within .aiexclude limits) and your GEMINI.md rules Plan a multi-step approach and present it before acting Edit multiple files , presenting each change as a reviewable diff Run tools — shell commands, file operations, grep — with your per-action approval , plus MCP servers for external systems (G07) Enable it: VS Code — toggle Agent in the chat input area. IntelliJ — the Agent tab in the Gemini tool window. (Since June 2026 agent mode requires a Standard or Enterprise license — see G00.) One honest limitation: source citations are not available in agent mode — weigh that for IP-sensitive work."},{"id":"the-loop","title":"The Plan → Diff → Approve Loop","text":"The Plan → Diff → Approve Loop Press play to watch one full agent cycle — this is exactly the shape of your lab: Agent mode — one full cycle You: Add tagging to recipes: storage, API endpoints, search filter, tests Agent reads: storage.py, app.py, search.py, tests/, GEMINI.md... Plan: 1) storage.py: tags column + migration 2) add/get with tags 3) app.py: accept tags on POST, filter on GET 4) search.py: tag filter 5) tests: new cases for all of the above — Proceed? You: Proceed, but tags must be lowercase-normalized on write ✦ Edit 1/5: storage.py — diff shown → you approve ✦ Edit 2/5: app.py — diff shown → you approve ⚠ Agent requests: run `pytest tests/ -v` [Allow once?] You: Allow ✓ 14 passed — agent reports done, summarizes all changes ▶ ▮▮ ↻ Press ▶ to watch a full agent cycle The three approval gates Plan gate — the agent proposes its approach first. This is your cheapest intervention point: redirecting a plan costs seconds; redirecting finished code costs minutes. (You used it above: \"tags must be lowercase-normalized.\") Diff gate — every file edit appears as an inline diff (green added / red removed) you approve or reject individually. Command gate — any shell command (install, test run, file delete) requires explicit permission before execution. Why It Matters The gates are what make delegation safe enough to use daily. Without them, an agent is a chaos machine with filesystem access; with them, it's a junior engineer whose every commit you review. The discipline transfer from G02–G04 (review before accept) is the same skill — now applied to plans and diffs instead of ghost text. Auto-approve mode exists (G07) and has its place, but you earn it after you've watched the gates work."},{"id":"checkpoints","title":"Checkpoints & Reverting","text":"Checkpoints & Reverting Technical Definition Before applying changes, Gemini Code Assist records a checkpoint — a snapshot of affected files. If an agent session goes sideways, Revert to checkpoint restores the files to their pre-suggestion state (generally available in IntelliJ; VS Code offers per-diff rejection and undo). This is the in-IDE safety net — but your real safety net is git: you committed Recipe Box at the end of G05, so git diff shows everything any agent did, and git restore . is the nuclear undo. Gotcha Checkpoints cover file edits — they do not undo command effects . If you approve pip install something or a script that writes to your database, reverting files won't uninstall the package or restore the data. That's why the command gate deserves your sharpest attention: read every command like it's about to run, because it is."},{"id":"lab","title":"Lab: Ship a 5-File Feature","text":"Lab: Ship a 5-File Feature The task mirrors real work: recipe tagging , touching storage, API, search, and tests. Prerequisites: Recipe Box as of G05 (with GEMINI.md, .aiexclude, passing pytest suite, git-committed). Safety first: clean git state terminal Copy git status # should be clean pytest tests/ -v # should be all green — this is your \"before\" truth Never start an agent session on a dirty tree: you want git diff afterward to show only what the agent did. Write the task like a ticket, not a wish Toggle Agent mode on and give it this — note it specifies outcomes and constraints, not implementation: agent prompt Copy Add tagging support to Recipe Box: 1. Recipes can have zero or more string tags (e.g. \"vegan\", \"quick\"). Store them in SQLite — your choice of schema, but explain the tradeoff you chose in the plan. 2. POST /recipes accepts an optional \"tags\" list; invalid tags (non-string, empty) → 400. 3. GET /recipes?tag=vegan filters by tag. 4. search_recipes gains an optional tags parameter (match = recipe has ALL given tags). 5. Tags are normalized to lowercase on write. 6. Update the pytest suite to cover all of this; everything must pass. Follow the GEMINI.md rules. Show me your plan before editing. WHAT: a 6-requirement ticket. WHY \"explain the tradeoff\": tags can be a JSON column (simple) or a join table (relational). Forcing the agent to justify its choice in the plan tells you whether it actually reasoned. GOTCHA: \"Show me your plan before editing\" makes the plan gate explicit — do this until it's habit. Review the plan like a tech lead Before approving, check the plan against this list: Does it touch all the right files ( storage.py , app.py , search.py , tests/ ) — and only those? Does its schema choice come with the requested justification? Does it mention migrating the existing recipes table (your DB already has data)? Does it plan to run the tests at the end? If anything's off, say so in plain language now — e.g. \"don't drop the table; migrate it\" . Iterating on the plan is the whole point of the gate. Review each diff — here's what \"reviewing\" means For every file diff the agent presents, run the same three questions: def add_recipe(recipe: dict) -> int: tags = [t.strip().lower() for t in recipe.get(\"tags\", [])] if any(not isinstance(t, str) or not t for t in recipe.get(\"tags\", [])): raise ValueError(\"tags must be non-empty strings\") try: with sqlite3.connect(DB_PATH) as conn: (1) Correct? — wait, the validation above runs after the lowercase comprehension would crash on non-strings. Order bug: validate first, then normalize. Reject this hunk and tell the agent exactly that. (2) In scope? — did it sneak in unrelated \"improvements\"? Reject those too. (3) Rule-compliant? — parameterized SQL, StorageError wrapping, type hints (your GEMINI.md is the contract). Let it prove itself, then commit When the agent asks to run pytest — allow it. Expect a wrinkle: some pre-existing tests may legitimately need updates (e.g., a test asserting exact dict shape now sees a tags key). Distinguish carefully: updating a test because the contract intentionally grew is fine; weakening a test to make a bug pass is not. When everything's green: terminal Copy git diff --stat # see the full footprint of what the agent changed pytest tests/ -v # your independent verification, outside the agent git add -A; git commit -m \"Add recipe tagging (agent-assisted, human-reviewed)\" ✅ Success criteria All tests green from your terminal (not just the agent's claim); curl -X POST with tags returns 201; GET /recipes?tag=vegan filters; git diff --stat shows changes only in expected files. If any criterion fails, that's your next agent prompt — with the evidence pasted in. What Just Happened? You delegated a coordinated 5-file feature and stayed in control through three gates: you corrected the plan (cheapest), caught an ordering bug in a diff (the review skill from G04, repurposed), and verified the result independently (never outsource the final pytest). Also notice GEMINI.md silently steering the agent the whole time — the G05 investment paying off at scale."},{"id":"when-which","title":"Chat vs Agent: Choosing the Right Mode","text":"Chat vs Agent: Choosing the Right Mode Situation Use Because \"Why does this fail?\" / \"How does X work?\" Chat You need understanding, not edits Single-file change you can review in one glance Chat (or smart action) Agent overhead buys nothing Coordinated change across 3+ files Agent Orchestration is the agent's superpower \"Make all TODOs in this project real\" Agent Needs project-wide reading + many edits Exploring design options before deciding Chat Cheap iteration on ideas; no files touched Migration (library/version) across the codebase Agent Mechanical, broad, verifiable by tests Rule of thumb: chat to decide, agent to execute. The expensive failure is the reverse — letting an agent \"explore\" (it explores by editing) or hand-applying a 9-file change chat described (you'll drop file six)."},{"id":"quiz","title":"Knowledge Check","text":"Knowledge Check 1. The fundamental shift from chat to agent mode is… A bigger model answers your questions From advising you to acting for you: the AI reads, plans, edits multiple files, and runs tools — while you review at gates It works without a license It only writes documentation 2. Why is the plan gate the cheapest place to intervene? Redirecting an approach before any code exists costs seconds; fixing finished wrong code costs the work plus the unwinding Plans are billed at a lower rate The agent refuses corrections after planning It isn't — diffs are cheaper 3. What do checkpoints NOT undo? Edits to Python files Edits to multiple files at once Side effects of approved commands — installed packages, modified databases, deleted artifacts Changes to GEMINI.md 4. The agent's test run passes. Before committing you should still… Nothing — the agent's word is verification Run pytest yourself and inspect git diff — independent verification of both behavior and change footprint Re-run the agent with the same prompt to compare Delete the checkpoint 5. \"Chat to decide, agent to execute\" means… Chat is deprecated once you have agent mode Explore options and build understanding in chat (no files touched); hand the chosen, well-specified task to the agent for coordinated execution Agents can't answer questions Use both simultaneously on the same task Quiz Complete! Ready for G07: Agent Mode II — MCP Servers & Power Tools → ← Previous G05: Context Mastery Next → G07: Agent Mode II — MCP"}]},{"file":"G07-agent-mode-mcp.html","title":"G07: Agent Mode II — MCP Servers & Power Tools","sections":[{"id":"mcp-concept","title":"Agent Mode II: MCP Servers & Power Tools","text":"Agent Mode II: MCP Servers & Power Tools In G06 your agent could touch files and run shell commands. Real work also lives in GitHub issues, databases, and APIs. MCP is how the agent reaches them — safely and pluggably. What MCP Is Analogy First Before USB existed, every device needed its own special port: one plug for the printer, another for the keyboard, a third for the scanner — and a laptop maker had to anticipate every device you'd ever own. The pain was the N×M problem : every device times every computer needed custom engineering. USB fixed it with one standard socket: any compliant device works with any compliant computer, including devices invented years later. MCP Model Context Protocol — an open standard (originated by Anthropic, adopted across the industry, including Google) that defines how AI applications discover and call external tools and data sources. is USB for AI tools: one protocol socket on the agent, and any MCP-compliant server — GitHub, Postgres, Stripe, your company's internal API — plugs in. Gemini didn't need to be engineered for your tool, and your tool didn't need to know about Gemini. Technical Definition The Model Context Protocol (MCP) is an open standard through which an AI application discovers and invokes external capabilities. An MCP server is a small program (often run via npx or Docker, or hosted remotely over HTTP) that exposes tools — e.g., a GitHub server exposes get_issue , create_pull_request , search_code . In agent mode, Gemini Code Assist lists each server's tools to the model; when the agent wants to call one, the same command-gate approval from G06 applies. Historically Gemini Code Assist had a \"tools\" (@-syntax) feature — it was removed in October 2025; MCP in agent mode is its replacement , so ignore older tutorials showing @github syntax."},{"id":"configuring-mcp","title":"Configuring MCP Servers","text":"Configuring MCP Servers Where configuration lives VS Code: ~/.gemini/settings.json — an mcpServers object (shared with Gemini CLI, which reads the same file — configure once, use in both) IntelliJ / JetBrains: mcp.json in the IDE's Gemini configuration directory — identical JSON structure WHAT: a GitHub MCP server entry. WHY the token lives in env : secrets pass to the server process as environment variables — never write them into prompts or GEMINI.md. GOTCHA: JSON has no comments; the file must be valid JSON or the server list silently fails to load. ~/.gemini/settings.json Copy { \"mcpServers\": { \"github\": { \"command\": \"npx\", \"args\": [\"-y\", \"@modelcontextprotocol/server-github\"], \"env\": { \"GITHUB_PERSONAL_ACCESS_TOKEN\": \"ghp_your_token_here\" } } } } After saving, restart the IDE (or reload the window). In VS Code agent mode, two slash commands confirm what loaded: /mcp — lists configured MCP servers and their status /tools — lists every tool currently available to the agent (built-ins + MCP) Security: treat MCP servers like dependencies An MCP server runs on your machine with your credentials and feeds output directly into the model's context. Install only servers you trust (official vendor servers or audited open source), scope tokens to the minimum (a fine-grained GitHub token limited to one repo beats a classic full-access token), and remember that data returned by a server can influence the agent's next actions — a malicious issue com

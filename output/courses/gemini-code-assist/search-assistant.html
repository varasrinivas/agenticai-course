<script id="course-index" type="application/json">[{"file":"CAPSTONE-API.html","title":"Capstone: TrackFlow — B2B Order Tracking API","sections":[{"id":"briefing","title":"Capstone: TrackFlow","text":"Capstone: TrackFlow \"Where's my order?\" is the most expensive question in B2B commerce — every call to a human rep costs ~$8–15. The answer is an API. You're building it. Domain Briefing: The Purchase-Order Lifecycle The Domain, Plainly A restaurant chain sends your distributor a purchase order (PO) A buyer's formal document requesting goods: PO number, line items with SKUs and quantities, requested delivery date. In B2B, the PO number is the key both sides use for everything. for 40 cases of cooking oil. From that moment, the order moves through a strict lifecycle: submitted, confirmed against inventory, picked in the warehouse, handed to a carrier, delivered. Two things make this harder than a shopping-cart tutorial. First, not all transitions are legal — a DELIVERED order cannot become CANCELLED, an order on credit hold can't ship — and every illegal transition that slips through becomes a financial dispute. Second, B2B contracts carry an SLA Service Level Agreement — a contractual promise, e.g. \"orders confirmed by 2pm ship within 2 business days.\" Breaches often trigger penalty credits. : ship within N days of confirmation or owe the customer credits. Distributors live and die by catching breaches before the customer's procurement system does. Why This Is a Real API Design Test This project is three durable API patterns in one: a state machine over HTTP (the transition endpoint), the adapter pattern (multiple carrier APIs behind one interface — the same shape as payment gateways and SMS providers), and computed business views (the SLA breach report). Master these three and most CRUD-plus services you'll ever build are variations."},{"id":"what-you-build","title":"What You Build","text":"What You Build The Spec trackflow — a Flask + SQLite API with: PO creation with line items; an enforced lifecycle state machine with audited transitions Two mock carrier adapters (FastShip, EconoFreight) behind one interface — tracking events per shipped order An SLA engine: promised-ship-date computed at confirmation; GET /sla/breaches reports at-risk and breached orders Full pytest suite (state machine exhaustively tested); GEMINI.md + .aiexclude from day zero; carrier adapter #2 shipped via agent mode; PR-reviewed before merge SUBMITTED → CONFIRMED → PICKING → SHIPPED → DELIVERED ON_HOLD (from SUBMITTED/CONFIRMED/PICKING → back to where it was) CANCELLED (terminal; only before SHIPPED) The Rules That Make It Real (encode ALL of these) Forward-only happy path; no skipping states (SUBMITTED → SHIPPED is illegal). ON_HOLD remembers and restores the previous state on release. CANCELLED is allowed from SUBMITTED/CONFIRMED/PICKING/ON_HOLD — never from SHIPPED or DELIVERED. Illegal transition → 409 Conflict with {\"error\": \"...\", \"current_state\": \"...\", \"allowed\": [...]} . Every transition appends to an immutable order_events audit table (who, when, from, to). SHIPPED requires a carrier + tracking number in the request body."},{"id":"ide-workflow","title":"Executing This Capstone in VS Code / PyCharm","text":"Executing This Capstone in VS Code / PyCharm Everything in this project is built through Gemini Code Assist inside your IDE — never by copying finished code from elsewhere. Each phase uses some of these five moves ; every paste-block below names its move in the header. Before you start (5-point checklist) Create the project folder and open it: VS Code File → Open Folder (PyCharm: File → Open ). New files via the Explorer panel / Project tool window. Confirm Gemini Code Assist is signed in: the ✦ icon in VS Code's Activity Bar opens the panel with no error badge (PyCharm: the Gemini tool window on the right edge greets you by account). Setup is module G01. Open the integrated terminal for git, Flask, curl, and pytest: Ctrl+` in VS Code (PyCharm: Alt+F12 ). Run the Flask server in one terminal tab and curl from a second (the + button splits/creates tabs). After creating GEMINI.md in Phase 1, start a new chat so the rules load into context (the G05 lesson). Chat and smart commands act on the active file or selection — keep the file you're working on focused, and select code before asking about it (the G03 gotcha). Move VS Code PyCharm / IntelliJ 1 · Spec-comment Type the comment in the editor and pause — ghost text appears. Tab accepts, Ctrl+→ accepts word-by-word, Esc rejects (G02) Same: type, pause, Tab ; hover the suggestion to cycle alternatives 2 · Chat / smart cmd Click the ✦ icon in the Activity Bar → chat panel opens. Select code first to scope it; /explain /fix /doc /simplify work here (G03) Gemini tool window (right edge) → Chat tab; same slash commands 3 · Generate tests Select the function/class → right-click → Gemini Code Assist → Generate unit tests ; save the output into tests/ (G04) Select → right-click → Gemini → Generate unit tests 4 · Agent ticket In the chat input, switch the Agent toggle ON → paste the ticket → review the plan in the panel → Accept/Reject each diff → click Allow when it asks to run a command (G06) Gemini tool window → Agent tab → paste the ticket; leave Auto-approve changes OFF; review diffs the same way 5 · Headless CLI Integrated terminal: gemini -p \"...\" — same login, same GEMINI.md rules as the IDE (G08) Example: a block labeled \"Move 4 · paste in Agent mode\" means: open the Gemini panel, flip the Agent toggle (VS Code) or open the Agent tab (PyCharm), paste, and work the plan→diff→approve loop."},{"id":"contracts","title":"API Contracts","text":"API Contracts endpoint contracts — this is your GEMINI.md \"API rules\" section Copy POST /orders body: {\"po_number\": \"PO-88412\", \"customer\": \"Riverside Restaurants\", \"lines\": [{\"sku\": \"OIL-CAN-5L\", \"qty\": 40, \"unit_price\": 18.50}]} 201 + order | 400 invalid | 409 duplicate po_number GET /orders/<po_number> 200 (order + events + sla block) | 404 GET /orders?state=SHIPPED&customer= 200 filtered list POST /orders/<po_number>/transition body: {\"to\": \"SHIPPED\", \"actor\": \"warehouse-3\", \"carrier\": \"fastship\", \"tracking_number\": \"FS123456\"} (carrier fields req. for SHIPPED) 200 + updated order | 409 illegal transition | 400 missing fields | 404 GET /orders/<po_number>/tracking 200 carrier events via adapter | 409 if not yet SHIPPED GET /sla/breaches?as_of=2026-06-15 200 {\"breached\": [...], \"at_risk\": [...]} # at_risk = due within 1 business day SLA rule: promised_ship_date = confirmation date + 2 business days (skip Sat/Sun). Breached = not SHIPPED by end of promised date. WHY business days matter: naive date math flags every Friday order as breached on Sunday — the classic bug this capstone wants you to catch with a test."},{"id":"phases","title":"Build Phases","text":"Build Phases Phase What happens Skills from 1. Foundation GEMINI.md with contracts + rules G05 2. Core Orders + state machine + audit G02–G03 3. Tests Exhaustive transition matrix G04 4. Carriers Adapter #1 by hand, #2 by agent G02, G06 5. SLA + Ship Breach engine, PR review, deploy G06, G09–G10 About the \"expected output\" blocks Each phase shows a sample of success. Your generated code will phrase things differently — match the shape : the status codes, the JSON fields named in the contracts, and the invariants (64 matrix cases, 409 bodies that include allowed ). Run the server with python app.py in one terminal tab and curl from a second. Foundation: the contract is the GEMINI.md New repo trackflow/ . Paste the endpoint contracts and the six state-machine rules into GEMINI.md verbatim, plus your standing conventions (storage layer separation, JSON errors, parameterized SQL, type hints, pytest temp-DB fixture). Add .aiexclude ( *.db , .env ). Commit before writing any code — in this capstone, the spec quality directly determines how little correcting you'll do later. Core: the state machine deserves its own module Build in this order, each via spec-comments with immediate verification: storage.py (orders, order_lines, order_events tables), then lifecycle.py — a pure module with no Flask and no SQL: Move 1 · type in the editor (lifecycle.py), pause for ghost text, Tab to accept Copy # Pure state machine for PO lifecycle. No I/O. # TRANSITIONS maps each state to the set of legal next states per the # six rules in GEMINI.md (ON_HOLD restores previous state; CANCELLED # only before SHIPPED; terminal states have no exits). # validate_transition(current, to, previous_state=None) returns None if legal, # else a string reason. Raises ValueError on unknown state names. TRANSITIONS: dict[str, set[str]] = { Then app.py routes that only orchestrate: validate input → call lifecycle → call storage → map results to status codes. Use chat on your own transition table (Move 2: select the TRANSITIONS dict in the editor, open the ✦ panel, type /explain plus the question): \"list every (from, to) pair this table allows — do any violate the six rules?\" — an AI audit of AI-written code, with you as the judge. Tests: the matrix, exhaustively Move 3, with a twist: select the whole of lifecycle.py → right-click → Gemini Code Assist → Generate unit tests — then refine the result in chat (Move 2) with an explicit demand: \"a parameterized pytest that checks EVERY (from, to) state pair — all 8×8 — against the expected legality, plus the ON_HOLD restore behavior and the SHIPPED-requires-carrier rule at the API level.\" 64 combinations is exactly what humans skip and generators don't. expected output — tests, the happy path, and a correct 409 PS> pytest tests/ -q ......................................................................... [100%] 73 passed in 0.84s # 64 matrix cases + API/lifecycle tests PS> curl -X POST http://localhost:5001/orders -H \"Content-Type: application/json\" -d \"{\\\"po_number\\\":\\\"PO-88412\\\",\\\"customer\\\":\\\"Riverside Restaurants\\\",\\\"lines\\\":[{\\\"sku\\\":\\\"OIL-CAN-5L\\\",\\\"qty\\\":40,\\\"unit_price\\\":18.50}]}\" {\"po_number\":\"PO-88412\",\"state\":\"SUBMITTED\",\"customer\":\"Riverside Restaurants\", \"lines\":[{\"sku\":\"OIL-CAN-5L\",\"qty\":40,\"unit_price\":18.5}], \"created_at\":\"2026-06-11T09:12:44\"} <-- 201 PS> curl -X POST http://localhost:5001/orders/PO-88412/transition -H \"Content-Type: application/json\" -d \"{\\\"to\\\":\\\"SHIPPED\\\",\\\"actor\\\":\\\"warehouse-3\\\"}\" {\"error\":\"illegal transition SUBMITTED -> SHIPPED\", \"current_state\":\"SUBMITTED\", \"allowed\":[\"CONFIRMED\",\"ON_HOLD\",\"CANCELLED\"]} <-- 409 PS> curl http://localhost:5001/orders/PO-88412 {\"po_number\":\"PO-88412\",\"state\":\"SUBMITTED\", ..., \"events\":[{\"from\":null,\"to\":\"SUBMITTED\",\"actor\":\"api\",\"at\":\"2026-06-11T09:12:44\"}], \"sla\":{\"promised_ship_date\":null,\"status\":\"NOT_CONFIRMED\"}} <-- 200 ✅ Checkpoint The parameterized matrix test exists and passes; a curl sequence SUBMITTED→CONFIRMED→PICKING→SHIPPED→DELIVERED works; SUBMITTED→SHIPPED returns 409 with the allowed list; the events table shows the full audit trail. Carriers: hand-build one, delegate the second Write carriers/base.py (an abstract CarrierAdapter with get_tracking_events(tracking_number) -> list[dict] ) and carriers/fastship.py yourself with comment-driven generation (Move 1) — a mock returning deterministic fake events (created → in_transit → out_for_delivery → delivered, derived from a hash of the tracking number so tests are stable). Then hand the pattern to the agent (G06): Move 4 · paste in Agent mode (Agent toggle ON / Agent tab) Copy Add a second carrier adapter \"econofreight\" following the existing CarrierAdapter pattern in carriers/. Differences: EconoFreight event payloads use {\"status_code\": \"IT\", \"ts\": ...} style codes (map them to our normalized events), and its mock should simulate a 2-day-slower timeline. Register it in the carrier factory, make POST .../transition accept it, and add tests mirroring the fastship ones. Plan first. expected output — normalized events, regardless of carrier # after transitioning PO-88412: CONFIRMED -> PICKING -> SHIPPED (carrier fastship, FS123456) PS> curl http://localhost:5001/orders/PO-88412/tracking {\"po_number\":\"PO-88412\",\"carrier\":\"fastship\",\"tracking_number\":\"FS123456\", \"events\":[ {\"status\":\"created\", \"at\":\"2026-06-09T08:14:00\"}, {\"status\":\"in_transit\", \"at\":\"2026-06-10T02:31:00\"}, {\"status\":\"out_for_delivery\", \"at\":\"2026-06-11T07:05:00\"}]} <-- 200 # an econofreight order returns the SAME event vocabulary — # its IT/OFD status codes were mapped inside the adapter: {\"po_number\":\"PO-88436\",\"carrier\":\"econofreight\",\"tracking_number\":\"EF777102\", \"events\":[ {\"status\":\"created\", \"at\":\"2026-06-08T11:02:00\"}, {\"status\":\"in_transit\",\"at\":\"2026-06-10T19:44:00\"}]} <-- 200 # tracking before SHIPPED: {\"error\":\"PO-88451 is in state PICKING; tracking available after SHIPPED\"} <-- 409 ✅ Checkpoint GET /orders/<po>/tracking returns normalized events for orders shipped on either carrier — proof the adapter seam works. The agent's diff stayed inside carriers/ , the factory, and tests; if it \"improved\" unrelated code, you rejected those hunks. SLA engine, review gate, ship Build sla.py (business-day math — write the Friday-confirmation test FIRST, then generate the implementation until it passes) and the /sla/breaches endpoint. Then the full G09–G10 finish: push to GitHub with .gemini/config.yaml + styleguide.md (encode the 409 contract and audit-trail rule as \"must flag\"), open the SLA feature as a PR, process the bot review, merge clean — and optionally deploy to Cloud Run (the G10 prep checklist applies unchanged: requirements.txt, Procfile, PORT, ephemeral-SQLite caveat). expected output — the SLA report, including the Friday case PS> pytest tests/test_sla.py -q ........ [100%] 8 passed in 0.21s # the test that matters: confirmed Friday 2026-06-12 -> # promised_ship_date == Tuesday 2026-06-16 (weekend skipped, NOT Sunday 06-14) PS> curl \"http://localhost:5001/sla/breaches?as_of=2026-06-15\" {\"breached\":[ {\"po_number\":\"PO-88371\",\"customer\":\"Marina Foods\",\"state\":\"CONFIRMED\", \"promised_ship_date\":\"2026-06-10\",\"days_late\":3}], \"at_risk\":[ {\"po_number\":\"PO-88393\",\"customer\":\"Hilltop Cafes\",\"state\":\"PICKING\", \"promised_ship_date\":\"2026-06-15\"}]} <-- 200"},{"id":"rubric","title":"Grading Rubric","text":"Grading Rubric State machine integrity: all 64 (from,to) pairs tested; ON_HOLD restores the prior state; CANCELLED blocked after SHIPPED; 409 responses include current_state and allowed Separation held: lifecycle.py has zero Flask/SQL imports; routes only orchestrate — and your GEMINI.md is why the generated code came out that way Audit immutability: every transition appends an event; no endpoint can edit or delete events; a test proves the trail for a full lifecycle Adapter seam works: two carriers, one interface, normalized events — and the second one was agent-built from a one-paragraph ticket referencing the first Business-day correctness: the Friday-confirmation case has a test, and it passes for the right reason (you can explain the calendar logic) Review gate used: SLA PR bot-reviewed; ≥1 finding fixed, ≥1 pushed back with reasoning Independent verification: final pytest + the full curl lifecycle run from your own terminal, not the agent's claim"},{"id":"stretch","title":"Stretch Goals","text":"Stretch Goals Webhooks: POST /webhooks/carrier receiving simulated carrier status pushes that auto-transition SHIPPED→DELIVERED — with signature verification. Idempotency keys: make POST /orders safe to retry via an Idempotency-Key header (real procurement systems retry aggressively). Pagination + ETags: page the order list and add conditional GET — ask chat to explain the trade-offs first. Front it: the Frontend capstone builds an ops dashboard directly on this API — do them as a pair for a full-stack portfolio piece. Where this goes on a resume \"Designed a B2B order-tracking API with an audited lifecycle state machine, pluggable carrier adapters, and SLA breach detection; exhaustive parameterized test coverage; AI-assisted development with human-reviewed agent workflows and automated PR review.\" ← Previous Capstone LienSight: Data Engineering Next Capstone → PriorAuth: Healthcare Backend"}]},{"file":"CAPSTONE-BACKEND.html","title":"Capstone: PriorAuth — Healthcare Pre-Authorization Backend","sections":[{"id":"briefing","title":"Capstone: PriorAuth","text":"Capstone: PriorAuth Before an insurer pays for an expensive procedure, a system checks the request against clinical criteria. That check delays real patients' care when it's slow and costs real money when it's wrong — which makes it one of the most consequential pieces of backend software in healthcare. Domain Briefing: Prior Authorization The Domain, Plainly A physician orders an MRI of the lower back. The clinic submits a prior authorization request to the insurer: which procedure (a CPT code Current Procedural Terminology — the standard 5-digit codes for medical procedures. 72148 = MRI lumbar spine without contrast; 97110 = therapeutic exercise. ), for which diagnosis (an ICD-10 code The international diagnosis coding standard. M54.50 = low back pain, unspecified; S83.511A = ACL sprain, initial encounter. ), plus clinical history. The insurer's criteria say things like: \"MRI lumbar spine is approved for low back pain only after 6 weeks of documented conservative therapy, unless red-flag conditions are present.\" Most requests are clear-cut either way — software should decide those in milliseconds. The genuinely ambiguous ones go to a human clinical reviewer. The pain in real systems: criteria hard-coded into if -statements (every policy update is a code deploy), decisions nobody can explain afterward, and audit trails that can't survive a regulator's subpoena. Your build fixes all three. Why This Is a Real Backend Test This is the canonical \"policy as data\" problem: a rules engine where criteria live in versioned JSON (clinical teams update policy without deploys), explainable decisions (every outcome carries machine-readable reason codes), and compliance-grade auditing (immutable, complete, PHI-safe). The same architecture runs loan underwriting, insurance claims, content moderation, and fraud rules — learn it here, reuse it everywhere. ⚠ Data Hygiene Is Part of the Grade Real prior-auth systems handle PHI Protected Health Information — patient-identifying health data regulated by HIPAA in the US. Unauthorized disclosure carries serious penalties. . You will use only synthetic data (you'll generate it), but you'll build the habits as if it were real: patient data files in .aiexclude , no patient identifiers in logs or error messages, and the audit trail referencing requests by internal ID only. Practicing on fake data with real discipline is exactly how professionals train."},{"id":"what-you-build","title":"What You Build","text":"What You Build The Spec priorauth — a Flask + SQLite service with: POST /requests — submit a prior-auth request (procedure CPT, diagnosis ICD-10, patient_age, clinical_flags like conservative_therapy_weeks , red_flag_neuro_deficit ) → evaluated immediately, returns 201 with a decision GET /requests/<id> → request + decision + reasons; GET /requests?outcome=DENIED → filtered list rules/criteria.json — versioned policy file; the engine in engine.py is pure (no Flask, no SQL) GET /audit/<request_id> — the immutable decision trail: which rule version ran, which conditions passed/failed, when pytest suite where every criteria rule has approve, deny, AND pend cases ; agent-mode feature; PR-reviewed APPROVED All criteria for the CPT/ICD pair satisfied. Returns auth number + validity window. DENIED A hard criterion failed. Reasons listed as codes + human text — deniable decisions must be appealable, so they must be explainable. PENDING_REVIEW Criteria partially met or unknown CPT/ICD combination. Never guess — route to a human queue."},{"id":"ide-workflow","title":"Executing This Capstone in VS Code / PyCharm","text":"Executing This Capstone in VS Code / PyCharm Everything in this project is built through Gemini Code Assist inside your IDE — never by copying finished code from elsewhere. Each phase uses some of these five moves ; every paste-block below names its move in the header. Before you start (5-point checklist) Create the project folder and open it: VS Code File → Open Folder (PyCharm: File → Open ). New files via the Explorer panel / Project tool window. Confirm Gemini Code Assist is signed in: the ✦ icon in VS Code's Activity Bar opens the panel with no error badge (PyCharm: the Gemini tool window on the right edge greets you by account). Setup is module G01. Open the integrated terminal for git, Python, and pytest: Ctrl+` in VS Code (PyCharm: Alt+F12 ). After creating GEMINI.md in Phase 1, start a new chat so the rules — especially the PHI hygiene section — load into context (the G05 lesson). Chat and smart commands act on the active file or selection — keep the file you're working on focused, and select code before asking about it (the G03 gotcha). Move VS Code PyCharm / IntelliJ 1 · Spec-comment Type the comment in the editor and pause — ghost text appears. Tab accepts, Ctrl+→ accepts word-by-word, Esc rejects (G02) Same: type, pause, Tab ; hover the suggestion to cycle alternatives 2 · Chat / smart cmd Click the ✦ icon in the Activity Bar → chat panel opens. Select code first to scope it; /explain /fix /doc /simplify work here (G03) Gemini tool window (right edge) → Chat tab; same slash commands 3 · Generate tests Select the function/class → right-click → Gemini Code Assist → Generate unit tests ; save the output into tests/ (G04) Select → right-click → Gemini → Generate unit tests 4 · Agent ticket In the chat input, switch the Agent toggle ON → paste the ticket → review the plan in the panel → Accept/Reject each diff → click Allow when it asks to run a command (G06) Gemini tool window → Agent tab → paste the ticket; leave Auto-approve changes OFF; review diffs the same way 5 · Headless CLI Integrated terminal: gemini -p \"...\" — same login, same GEMINI.md rules as the IDE (G08) Example: a block labeled \"Move 4 · paste in Agent mode\" means: open the Gemini panel, flip the Agent toggle (VS Code) or open the Agent tab (PyCharm), paste, and work the plan→diff→approve loop."},{"id":"rules-engine","title":"The Rules Engine: Policy as Data","text":"The Rules Engine: Policy as Data Your starter policy — three real-shaped criteria. This file is the product; the engine just evaluates it: rules/criteria.json (v1) Copy { \"version\": \"2026.06-v1\", \"criteria\": [ { \"cpt\": \"72148\", \"name\": \"MRI lumbar spine w/o contrast\", \"allowed_icd_prefixes\": [\"M54.5\", \"M51.2\", \"S33\"], \"requires\": [ {\"field\": \"conservative_therapy_weeks\", \"op\": \">=\", \"value\": 6, \"waived_by\": [\"red_flag_neuro_deficit\", \"red_flag_cancer_history\"], \"fail_code\": \"CONSERVATIVE_THERAPY_NOT_MET\"} ], \"age_range\": [18, null] }, { \"cpt\": \"97110\", \"name\": \"Therapeutic exercise (PT)\", \"allowed_icd_prefixes\": [\"M54\", \"M25\", \"S83\"], \"quantity_limit\": {\"max_units\": 12, \"per_days\": 90, \"fail_code\": \"QUANTITY_LIMIT_EXCEEDED\", \"exceeded_outcome\": \"PENDING_REVIEW\"} }, { \"cpt\": \"70551\", \"name\": \"MRI brain w/o contrast\", \"allowed_icd_prefixes\": [\"G43\", \"R51\", \"S06\"], \"requires\": [ {\"field\": \"headache_duration_weeks\", \"op\": \">=\", \"value\": 4, \"waived_by\": [\"red_flag_neuro_deficit\", \"red_flag_head_trauma\"], \"fail_code\": \"DURATION_NOT_MET\"} ] } ], \"defaults\": {\"unknown_cpt\": \"PENDING_REVIEW\", \"icd_mismatch\": \"DENIED\"} } Engine semantics to implement: ICD must match an allowed prefix (M54.50 matches prefix M54.5) else DENIED with ICD_NOT_INDICATED ; each requires condition must pass unless any waived_by flag is true (waivers must appear in the reasons as WAIVED_BY_RED_FLAG ); quantity limits sum prior approved units for the same patient_ref within the window; unknown CPT → PENDING_REVIEW (the \"never guess\" rule). GOTCHA: the waiver logic is where most first implementations go wrong — waived means the condition is skipped and recorded , not passed silently ."},{"id":"phases","title":"Build Phases","text":"Build Phases Phase What happens Skills from 1. Foundation GEMINI.md + PHI hygiene + synthetic data G05, G08 2. Engine Pure rules engine, test-first G02–G04 3. Service API + immutable audit trail G02–G03 4. Policy change New criteria version via agent mode G06 5. Ship PR review + compliance self-audit G09 About the \"expected output\" blocks Each phase shows a sample of success. Your generated code will phrase details differently — what must match is the shape : the three outcomes, machine-readable reason codes, rules_version on every decision, and audit entries that never name a patient. Run the service with python app.py (port 5002 in these samples) and curl from a second terminal tab. Foundation: hygiene rules before anything else New repo priorauth/ . Your GEMINI.md gets a section no other capstone has — write it first: GEMINI.md — the PHI section (plus your usual conventions) Copy ## Data hygiene (non-negotiable) - All patient data in this project is SYNTHETIC. - Requests reference patients by opaque patient_ref (e.g. \"PT-3920\") — never name, DOB, SSN, or address. No such fields may exist in any schema. - Log lines and error messages NEVER include patient_ref or clinical flags; reference requests by request_id only. - The engine (engine.py) is pure: no Flask, no SQL, no I/O, no logging. - Decisions are deterministic: same request + same rules version = same outcome and same reason codes, always. Add .aiexclude with data/ and *.db . Then generate synthetic test requests headlessly (Move 5 — in the integrated terminal, gemini -p \"...\" > make_requests.py ): \"a script producing 30 synthetic prior-auth requests as JSON covering all three CPTs: clear approvals, clear denials (wrong ICD, therapy weeks too low), waiver cases (red flags), quantity-limit edge cases at exactly 12 units, and 3 unknown CPTs\" . ✅ Checkpoint In a fresh chat, ask \"what patient data does this project contain?\" — Gemini should describe the schema but be unable to quote rows from data/ (your .aiexclude at work, exactly as in G05). Engine: write the tests before the engine exists This capstone inverts the usual order — in compliance software, expected outcomes are specifiable up front, so specify them. Open rules/criteria.json in the editor (active file = chat context), then in chat (Move 2): \"Generate a pytest file for a not-yet-written engine.evaluate(request: dict, rules: dict) -> Decision . Cover for each criterion: approve, deny with the exact fail_code, waiver path (with WAIVED_BY_RED_FLAG in reasons), ICD prefix mismatch → ICD_NOT_INDICATED, unknown CPT → PENDING_REVIEW, and the 97110 quantity boundary at exactly max_units.\" Review the expected values against the JSON yourself — you are signing off on policy here, not code . Then build engine.py with spec-comments (Move 1) until pytest tests/ -v in the integrated terminal is green. expected output — the pre-written suite goes green PS> pytest tests/test_engine.py -v tests/test_engine.py::test_72148_approved_with_6_weeks_therapy PASSED tests/test_engine.py::test_72148_denied_therapy_not_met PASSED tests/test_engine.py::test_72148_waived_by_neuro_red_flag PASSED tests/test_engine.py::test_icd_prefix_mismatch_denied PASSED tests/test_engine.py::test_unknown_cpt_pending_review PASSED tests/test_engine.py::test_97110_quantity_at_exact_limit PASSED tests/test_engine.py::test_97110_quantity_exceeded_pends PASSED ... 24 passed in 0.34s ✅ Checkpoint Engine green against the pre-written suite; evaluate() imports nothing but stdlib; running it twice on the same input yields byte-identical decisions. Service: thin API, fat audit Build storage.py + app.py via spec-comments (Move 1). The route does four things only: validate → evaluate → persist (request, decision, reasons, rules_version) → append audit events. Use chat as your compliance reviewer before moving on: Move 2 · paste in chat (✦ panel / Gemini tool window) — the self-audit prompt Copy Audit this codebase against the \"Data hygiene\" section of GEMINI.md: 1. Does any log statement or error message include patient_ref or clinical flags? 2. Can any endpoint mutate or delete audit rows? 3. Is rules_version stored with every decision? List violations with file:line, or confirm each rule passes. expected output — one of each outcome, plus the audit trail # APPROVED (72148, ICD M54.50, 8 weeks therapy) {\"request_id\":\"REQ-0007\",\"outcome\":\"APPROVED\", \"auth_number\":\"PA-2026-0007\",\"valid_through\":\"2026-09-09\", \"reasons\":[{\"code\":\"ALL_CRITERIA_MET\",\"detail\":\"icd allowed; therapy 8/6 weeks\"}], \"rules_version\":\"2026.06-v1\"} <-- 201 # DENIED (72148, only 4 weeks therapy, no red flags) {\"request_id\":\"REQ-0011\",\"outcome\":\"DENIED\", \"reasons\":[{\"code\":\"CONSERVATIVE_THERAPY_NOT_MET\", \"detail\":\"4 weeks documented; 6 required\"}], \"rules_version\":\"2026.06-v1\"} <-- 201 # PENDING_REVIEW (unknown CPT 99999) {\"request_id\":\"REQ-0019\",\"outcome\":\"PENDING_REVIEW\", \"reasons\":[{\"code\":\"UNKNOWN_CPT\",\"detail\":\"99999 not in criteria set\"}], \"rules_version\":\"2026.06-v1\"} <-- 201 PS> curl http://localhost:5002/audit/REQ-0011 [{\"event\":\"EVALUATED\",\"rules_version\":\"2026.06-v1\",\"at\":\"2026-06-11T10:42:18\", \"conditions\":[{\"check\":\"icd_prefix_allowed\",\"result\":\"PASS\"}, {\"check\":\"conservative_therapy_weeks>=6\",\"result\":\"FAIL\"}]}] # note: request_id only — no patient_ref anywhere in audit or logs ✅ Checkpoint All 30 synthetic requests POST successfully with sensible outcomes; GET /audit/<id> shows rule version + per-condition results; the self-audit returns clean (fix anything it flags — it usually finds a logging leak on the 404 path). Policy change: the day-two test, via agent Real rules engines are judged on day two, when policy changes. Simulate it with an agent-mode ticket (G06): Move 4 · paste in Agent mode (Agent toggle ON / Agent tab) Copy Policy update effective 2026-07-01, ship as rules version \"2026.07-v2\" in a NEW file rules/criteria_2026_07.json (v1 stays untouched): 1. 72148: conservative therapy requirement rises from 6 to 8 weeks. 2. New criterion: CPT 73721 (MRI knee), allowed ICD prefixes S83/M23/M25, requires conservative_therapy_weeks >= 4, waived by red_flag_locked_knee. 3. The service selects the rules file by decision date: requests on/after 2026-07-01 use v2, earlier use v1. Decision date is injectable for tests. 4. Tests: the SAME request approved under v1 (7 weeks therapy) is DENIED under v2 — prove version selection works both ways. Plan first. Do not modify engine.py unless something truly requires it. expected output — the same request flips across the version boundary PS> pytest tests/test_versioning.py -v tests/test_versioning.py::test_7wk_request_approved_under_v1 PASSED tests/test_versioning.py::test_7wk_request_denied_under_v2 PASSED tests/test_versioning.py::test_decision_date_selects_rules_file PASSED tests/test_versioning.py::test_73721_knee_mri_new_in_v2 PASSED 4 passed in 0.18s # identical clinical facts, different decision dates: decision date 2026-06-15 -> APPROVED (rules_version 2026.06-v1, 6 wks required) decision date 2026-07-02 -> DENIED (rules_version 2026.07-v2, 8 wks required, reason CONSERVATIVE_THERAPY_NOT_MET) # both decisions sit in the audit trail, each citing its own rules_version ✅ Checkpoint The acid test: if the agent's plan says it must edit engine.py , interrogate why — a true policy-as-data design needs only a rules file + version selection. (If your engine genuinely needs changes, that's a finding about your Phase 2 design — the failing-test lesson from G04 at architecture scale.) The 7-weeks request flips outcomes across the version boundary, with both results in the audit trail citing their rules version. Ship: review gate with compliance teeth Push to GitHub. Your .gemini/styleguide.md \"must flag (High)\" list: patient_ref or clinical flags in any log/error string; audit-table mutation; SQL via f-strings; decisions stored without rules_version; engine.py importing Flask or sqlite3. Open Phase 4 as a PR, run the G09 discipline (fix / push back / interrogate), merge clean. Finish with a headless README: domain summary, the three outcomes, how policy updates ship without code deploys, and how to run the tests."},{"id":"rubric","title":"Grading Rubric","text":"Grading Rubric Policy as data: the v2 policy change shipped with zero engine.py edits (or you can articulate exactly why the engine had a design gap and what you changed) Explainability: every DENIED decision carries machine-readable fail codes and human-readable text; waivers appear explicitly as WAIVED_BY_RED_FLAG, never as silent passes Determinism: a test proves same request + same rules version = identical decision and reasons Never guess: unknown CPT and partially-met criteria route to PENDING_REVIEW — with tests — rather than defaulting to approve or deny Audit-grade trail: immutable events with rules version and per-condition results; no endpoint can alter history; version boundary visible across the v1/v2 flip PHI hygiene: .aiexclude verified by the fresh-chat test; the chat self-audit and the PR bot both came back clean on logging leaks Test-first held: the Phase 2 suite existed before engine.py, and you corrected at least one expected value in the generated tests after checking it against criteria.json yourself"},{"id":"stretch","title":"Stretch Goals","text":"Stretch Goals Reviewer queue: GET /queue + POST /requests/<id>/resolve for human resolution of PENDING_REVIEW items — with the resolution joining the audit trail. Appeals: a DENIED request can be resubmitted with new clinical flags, linked to the original; the decision must cite both. Criteria linting: a pipeline-style validator that checks a new criteria.json for structural errors (unknown ops, overlapping CPTs, missing fail_codes) before the service will load it. Throughput report: gemini -p headless summary of decision distribution per rules version — the report a medical director would actually read. Where this goes on a resume \"Built a healthcare prior-authorization backend with a versioned policy-as-data rules engine, explainable decisions with reason codes, immutable audit trails, and PHI-safe logging; policy updates ship as data with zero code deploys.\" ← Previous Capstone TrackFlow: B2B Order Tracking API Next Capstone → TrackFlow Ops Dashboard"}]},{"file":"CAPSTONE-DATA-ENGINEERING.html","title":"Capstone: LienSight — UCC Lien Risk Data Pipeline","sections":[{"id":"briefing","title":"Capstone: LienSight","text":"Capstone: LienSight A commercial lender asks one question before lending against a business's equipment or inventory: does someone else already have a claim on it? The answer lives in public lien filings — and the data is famously filthy. Your job: make it answerable. Domain Briefing: UCC Filings The Domain, Plainly When a bank lends money against a company's assets, it files a UCC-1 financing statement A public notice filed with a state's Secretary of State declaring a creditor's security interest (lien) in a debtor's assets, under Article 9 of the Uniform Commercial Code. with the state — a public \"dibs\" notice on those assets. Before any new lender extends credit, they search these filings. The pain: filings are entered by humans at dozens of state offices. The same company appears as \"ACME Industrial Supply LLC\" , \"Acme Industrial Supply, L.L.C.\" , and \"ACME INDUST SUPPLY\" . Amendments ( UCC-3 A follow-up filing that amends, continues, assigns, or terminates an existing UCC-1 — identified by referencing the original filing number. ) terminate or continue earlier filings but only reference them by filing number. Filings silently lapse A UCC-1 is effective for 5 years from its file date. Unless a continuation (UCC-3) is filed, it lapses and the lien is no longer perfected. after 5 years. A lender who misreads this data either loses collateral priority (real money) or wrongly denies a good loan (real customers). Companies like Moody's, Dun & Bradstreet, and a dozen fintech startups run exactly the pipeline you're about to build. Why This Is a Real Data Engineering Test This project hits every classic DE problem in miniature: ingestion of inconsistent source files, data quality rules, entity resolution (the name-variant problem), slowly changing state (amendments and lapses), and serving aggregates for a downstream consumer. If you can explain your silver-layer decisions in a job interview, this capstone did its job."},{"id":"what-you-build","title":"What You Build","text":"What You Build The Spec liensight — a Python pipeline (pandas + SQLite, no cloud required) with a CLI runner: python pipeline.py run --stage bronze|silver|gold|all — executes stages idempotently (re-running a stage never duplicates data) python pipeline.py report — prints a data-quality report (rows in/out per stage, rejects with reasons) A pytest suite covering every transformation rule GEMINI.md + .aiexclude from day zero; one feature shipped via agent mode; the data-quality report generated headlessly via Gemini CLI BRONZE data/bronze/filings.db Raw CSVs loaded as-is + load metadata (source file, loaded_at). Never edited — the replayable source of truth. SILVER cleaned_filings, entities Typed, deduplicated, validated rows; debtor names normalized; name variants resolved to entity_ids; rejects quarantined with reasons. GOLD entity_risk, lapse_alerts Per-entity aggregates: active lien count, secured parties, earliest expiry, risk score, and filings lapsing within 90 days."},{"id":"ide-workflow","title":"Executing This Capstone in VS Code / PyCharm","text":"Executing This Capstone in VS Code / PyCharm Everything in this project is built through Gemini Code Assist inside your IDE — never by copying finished code from elsewhere. Each phase uses some of these five moves ; every paste-block below names its move in the header. Before you start (5-point checklist) Create the project folder and open it: VS Code File → Open Folder (PyCharm: File → Open ). New files via the Explorer panel / Project tool window. Confirm Gemini Code Assist is signed in: the ✦ icon in VS Code's Activity Bar opens the panel with no error badge (PyCharm: the Gemini tool window on the right edge greets you by account). Setup is module G01. Open the integrated terminal for git, Python, and test runs: Ctrl+` in VS Code (PyCharm: Alt+F12 ). All git / pytest / python commands in this page run there. After creating GEMINI.md in Phase 1, start a new chat so the rules load into context (the G05 lesson). Chat and smart commands act on the active file or selection — keep the file you're working on focused, and select code before asking about it (the G03 gotcha). Move VS Code PyCharm / IntelliJ 1 · Spec-comment Type the comment in the editor and pause — ghost text appears. Tab accepts, Ctrl+→ accepts word-by-word, Esc rejects (G02) Same: type, pause, Tab ; hover the suggestion to cycle alternatives 2 · Chat / smart cmd Click the ✦ icon in the Activity Bar → chat panel opens. Select code first to scope it; /explain /fix /doc /simplify work here (G03) Gemini tool window (right edge) → Chat tab; same slash commands 3 · Generate tests Select the function/class → right-click → Gemini Code Assist → Generate unit tests ; save the output into tests/ (G04) Select → right-click → Gemini → Generate unit tests 4 · Agent ticket In the chat input, switch the Agent toggle ON → paste the ticket → review the plan in the panel → Accept/Reject each diff → click Allow when it asks to run a command (G06) Gemini tool window → Agent tab → paste the ticket; leave Auto-approve changes OFF; review diffs the same way 5 · Headless CLI Integrated terminal: gemini -p \"...\" — same login, same GEMINI.md rules as the IDE (G08) Example: a block labeled \"Move 4 · paste in Agent mode\" means: open the Gemini panel, flip the Agent toggle (VS Code) or open the Agent tab (PyCharm), paste, and work the plan→diff→approve loop."},{"id":"architecture","title":"Architecture & Data Contracts","text":"Architecture & Data Contracts Source data: three monthly CSV drops (you'll generate them — messy on purpose — in Phase 1). Columns: source schema — ucc_filings_2026_0X.csv Copy filing_number e.g. \"2026-0142337\" (unique per filing... usually) filing_type UCC1 | UCC3-AMEND | UCC3-CONT | UCC3-TERM (inconsistent casing) file_date MIXED FORMATS: \"2026-03-14\", \"03/14/2026\", \"14-Mar-26\" debtor_name free text, name variants, stray punctuation, ALL CAPS sometimes debtor_state 2-letter code, sometimes full state name secured_party lender name, same chaos as debtor_name collateral_desc free text (\"all inventory and equipment\", may be empty) ref_filing for UCC3 rows: the UCC-1 filing_number it modifies (sometimes missing!) Core transformation rules your silver stage must enforce (this IS the project — put these in GEMINI.md): Dates: parse all three formats to ISO; unparseable → reject with reason BAD_DATE . Dedup: same filing_number + same content → keep first; same number, different content → reject both as CONFLICT (a human must look). Entity resolution: normalize debtor names (uppercase, strip punctuation, expand/strip suffixes LLC/INC/CORP, collapse whitespace) → identical normalized names share an entity_id . Lien status: a UCC-1 is ACTIVE until a UCC3-TERM references it, LAPSED 5 years after file_date unless a UCC3-CONT extends it 5 more, else TERMINATED . Orphans: UCC-3 rows whose ref_filing is missing or matches nothing → quarantine as ORPHAN_AMENDMENT , never silently dropped. The Trap Most Students Hit Lien status is order-dependent state , not a row-level transform: a TERM filed before a CONT means something different than the reverse. Process amendments in file_date order per referenced filing. When your generated tests disagree with your code about a TERM→CONT sequence, draw the timeline on paper before deciding which is right — this is the capstone's \"failing test is information\" moment (G04)."},{"id":"phases","title":"Build Phases","text":"Build Phases Each phase names the course skills it exercises and gives you the key prompt. You write the judgment; Gemini writes the labor. About the \"expected output\" blocks Every phase below shows a sample of what success looks like. Because Gemini generates your code, your exact counts, wording, and formatting will differ — what must match is the shape (the same kinds of lines appear) and the invariants (e.g., bronze = silver + rejects). If your output is structurally different — missing reject reasons, no idempotency, counts that don't reconcile — that's a finding to fix, not a formatting quirk. Phase What happens Skills from 1. Foundation Rules + messy mock data G05, G08 2. Bronze Idempotent ingestion G02 3. Silver Cleaning + entity resolution + tests G02–G04 4. Gold Risk aggregates via agent mode G06 5. Ship DQ report, PR review, docs G08–G09 Foundation: rules before code, then manufacture chaos New folder liensight/ , git init . Write GEMINI.md containing the five transformation rules above, plus: \"pandas for transforms, sqlite3 for storage; every stage is a pure function frame-in/frame-out; rejects are quarantined with a reason code, never dropped; type hints everywhere; pytest with tmp_path fixtures.\" Add .aiexclude with data/ (generated data stays out of prompts — it's bulky noise). Then generate the test data with Gemini CLI: Move 5 · integrated terminal (Ctrl+` / Alt+F12) — headless data generation Copy gemini -p \"Write a Python script make_data.py that generates 3 CSVs (data/raw/ucc_filings_2026_01.csv, _02, _03) with ~120 rows total matching this schema: filing_number, filing_type (UCC1/UCC3-AMEND/UCC3-CONT/UCC3-TERM, inconsistent casing), file_date (deliberately mixed formats: ISO, MM/DD/YYYY, DD-Mon-YY), debtor_name (include 4 companies that each appear under 3 name variants like 'ACME Industrial Supply LLC' / 'Acme Industrial Supply, L.L.C.'), debtor_state, secured_party, collateral_desc (some empty), ref_filing (UCC3 rows reference real UCC1 numbers, but make 3 of them orphans and 2 missing). Include 2 duplicate filing_numbers with identical content and 1 with conflicting content. Use only the stdlib + random with a fixed seed.\" > make_data.py python make_data.py expected output — shape matters, your seeded values will differ PS> python make_data.py Wrote data/raw/ucc_filings_2026_01.csv (42 rows) Wrote data/raw/ucc_filings_2026_02.csv (40 rows) Wrote data/raw/ucc_filings_2026_03.csv (44 rows) PS> Get-Content data\\raw\\ucc_filings_2026_01.csv -TotalCount 4 filing_number,filing_type,file_date,debtor_name,debtor_state,secured_party,collateral_desc,ref_filing 2026-0142337,UCC1,2026-03-14,ACME Industrial Supply LLC,OH,First Commercial Bank,all inventory and equipment, 2026-0142401,ucc3-amend,03/22/2026,\"Acme Industrial Supply, L.L.C.\",OH,First Commercial Bank,,2026-0142337 2026-0142498,UCC1,22-Mar-26,BLUE RIVER LOGISTICS,TX,Lone Star Credit,fleet vehicles, ✅ Checkpoint Three CSVs exist; open one and visually confirm the chaos (mixed dates, name variants, orphan refs). You just used AI to build a realistic test fixture — a legitimate professional trick. Bronze: boring on purpose Create stages/bronze.py with a header docstring stating the bronze contract (load raw, add source_file and loaded_at , never transform, idempotent by source_file). Generate load_bronze() from spec-comments (Move 1: type the comment in bronze.py , pause for ghost text, Tab to accept). The interesting requirement is idempotency : re-running must not duplicate rows — spec it in the comment (\"delete existing rows for this source_file before insert\") and verify by running it twice. expected output — note the second run changes nothing PS> python pipeline.py run --stage bronze [bronze] ucc_filings_2026_01.csv -> 42 rows loaded [bronze] ucc_filings_2026_02.csv -> 40 rows loaded [bronze] ucc_filings_2026_03.csv -> 44 rows loaded [bronze] total rows in data/bronze/filings.db: 126 PS> python pipeline.py run --stage bronze # idempotency check [bronze] total rows in data/bronze/filings.db: 126 <-- unchanged ✅ Checkpoint python pipeline.py run --stage bronze twice in a row → same row count both times. Bronze row count equals raw CSV row count exactly (rejects don't exist yet — bronze takes everything). Silver: where the thinking lives Build stages/silver.py function by function with spec-comments (Move 1): parse_dates , dedupe_filings , normalize_name , resolve_entities , compute_lien_status . After each function, immediately generate its tests (Move 3: select the function → right-click → Gemini Code Assist → Generate unit tests ) and run them with pytest tests/ -v in the integrated terminal. Use chat to pressure-test your own rules before coding them: Move 2 · paste in chat (✦ panel / Gemini tool window) — design review before code Copy My name normalization rule: uppercase, strip punctuation, remove suffixes LLC/INC/CORP/LP, collapse whitespace. Give me 5 realistic company-name pairs where this rule WRONGLY merges two different companies, and 3 pairs it wrongly keeps apart. Should I add anything cheap to reduce the worst risk? What you'll discover Chat will show you that \"JOHNSON SUPPLY\" (Ohio) and \"JOHNSON SUPPLY\" (Texas) merge wrongly — which is why your entity_id should include debtor_state . Real entity-resolution teams fight exactly this; your cheap fix (state-scoped identity) is the same first move they make. expected output — the invariant: input = cleaned + rejected PS> python pipeline.py run --stage silver [silver] input rows: 126 [silver] cleaned: 114 rejected: 12 [silver] BAD_DATE: 3 · CONFLICT: 2 · ORPHAN_AMENDMENT: 5 · DUPLICATE: 2 [silver] entities resolved: 58 distinct (4 variant groups merged) PS> pytest tests/ -q ............................ [100%] 28 passed in 0.61s ✅ Checkpoint Silver runs end-to-end; the 4 variant-named companies resolve to 4 entity_ids (not 12); the conflict-duplicate and orphan rows sit in the rejects table with correct reason codes; pytest all green. Gold: delegate it to the agent The gold layer is well-specified mechanical work over clean data — perfect agent-mode material (G06). Clean git state first, then the ticket: Move 4 · paste in Agent mode (Agent toggle ON / Agent tab) Copy Add the gold stage per GEMINI.md rules: 1. stages/gold.py builds two tables from silver: - entity_risk: entity_id, canonical_name, state, active_lien_count, distinct_secured_parties, earliest_expiry_date, risk_score - lapse_alerts: ACTIVE filings whose 5-year expiry (incl. continuations) falls within the next 90 days from a --as-of date parameter 2. risk_score 0-100: propose a simple weighted formula from the available fields in your plan and JUSTIFY the weights before implementing. 3. Wire --stage gold and --as-of into pipeline.py. 4. pytest coverage for both tables including a continuation-extends-expiry case. Show me your plan first. expected output — gold stage and a peek at the risk table PS> python pipeline.py run --stage gold --as-of 2026-06-11 [gold] entity_risk: 58 rows [gold] lapse_alerts: 6 filings expire within 90 days of 2026-06-11 PS> python -c \"import sqlite3; [print(r) for r in sqlite3.connect('data/gold/gold.db').execute('SELECT canonical_name,state,active_lien_count,risk_score FROM entity_risk ORDER BY risk_score DESC LIMIT 3')]\" ('ACME INDUSTRIAL SUPPLY', 'OH', 5, 78) ('BLUE RIVER LOGISTICS', 'TX', 3, 52) ('HILLTOP FOODS', 'CA', 2, 41) PS> pytest tests/ -q .................................... [100%] 36 passed in 0.74s ✅ Checkpoint You challenged at least one thing in the agent's plan (the risk formula is designed to provoke this — if its weights seem arbitrary, say so and make it defend or revise them). Tests green from your terminal; git diff --stat footprint matches the ticket. Ship: report, review, document Implement pipeline.py report (rows in/out per stage, rejects by reason, entities resolved, alerts found). Then close the professional loop: push to GitHub, add .gemini/styleguide.md (reuse your GEMINI.md rules), open the gold stage as a PR, and process the bot's review (G09 discipline: fix / push back / interrogate). Finally, generate the docs headlessly: Move 5 · integrated terminal Copy gemini -p \"Write README.md for this pipeline: the UCC domain in 5 sentences, the medallion stages and what each guarantees, every CLI command with examples, the five silver transformation rules, and how to run the tests. Only markdown.\" > README.md python pipeline.py report # paste this output into the README yourself expected output — the report a risk manager would read PS> python pipeline.py report LIENSIGHT DATA QUALITY REPORT as of 2026-06-11 ------------------------------------------------------ bronze 126 rows from 3 source files silver 114 cleaned (90.5%) | 12 quarantined BAD_DATE 3 · CONFLICT 2 · ORPHAN_AMENDMENT 5 · DUPLICATE 2 entities 58 distinct (4 variant groups merged; largest group: 3 names) gold 58 entity_risk rows · 6 lapse alerts (90-day window) invariant: bronze(126) == silver(114) + rejects(12) OK"},{"id":"rubric","title":"Grading Rubric","text":"Grading Rubric Replayability: deleting data/bronze onward and re-running --stage all reproduces identical gold tables (fixed seed, idempotent stages) Nothing vanishes: every raw row is accounted for — cleaned, deduped, or quarantined with a reason code; bronze count = silver count + rejects count Entity resolution works: the 4 variant-named companies resolve to exactly 4 state-scoped entities, with a test proving it State machine correct: TERM ends a lien, CONT extends expiry 5 years, ordering by file_date respected — each with a test Agent discipline: you redirected the agent's gold-stage plan (risk weights) or rejected at least one diff hunk, and verified independently Review gate used: the gold PR got a bot review; at least one finding fixed and one pushed back on with reasoning You can defend it: you can explain to an interviewer why entity_id includes state, and what your pipeline does with an orphan UCC-3"},{"id":"stretch","title":"Stretch Goals","text":"Stretch Goals Fuzzy entity resolution: add rapidfuzz similarity matching above your exact-normalized baseline; measure how many new merges it makes and how many are wrong (precision matters more than recall for lenders). BigQuery edition (G10): load the gold tables into BigQuery and use Gemini in BigQuery to write the \"top 10 riskiest entities\" query in natural language. Scheduled DQ report: wrap pipeline.py report | gemini -p \"summarize for a non-technical risk manager\" in a scheduled task — your first AI-in-the-loop data ops job. Incremental loads: add a fourth monthly CSV and make silver/gold process only the delta. Where this goes on a resume \"Built a Medallion-architecture pipeline for public lien filings with quarantine-based data quality, state-scoped entity resolution, and amendment state tracking; AI-assisted development with human-reviewed agent workflows.\" Every phrase in that sentence is now true. ← Course Home All Modules & Capstones Next Capstone → TrackFlow: B2B Order Tracking API"}]},{"file":"CAPSTONE-FRONTEND.html","title":"Capstone: TrackFlow Ops Dashboard — Frontend","sections":[{"id":"briefing","title":"Capstone: TrackFlow Ops Dashboard","text":"Capstone: TrackFlow Ops Dashboard APIs don't answer phones — people do, and they answer faster when the screen in front of them is honest, fast, and readable from six feet away. This capstone is about building that screen well, with Gemini doing the labor of layout, fetch plumbing, and rendering while you direct the UX decisions. Domain Briefing: The Ops Floor The Domain, Plainly The customer-service team at a wholesale distributor lives in a tool like this. A restaurant calls: \"where's PO-88412?\" The rep needs the answer in under five seconds: current state, carrier events, and — critically — whether the order is about to breach its SLA before the customer mentions it . The pain with bad ops dashboards is always the same three failures: stale data presented as fresh (the rep promises \"it shipped\" when it didn't), failure states that look like empty states (the API is down but the screen shows \"no orders\" — so the rep tells the customer there's no order), and mouse-only UIs that slow down power users who live on the keyboard. Your dashboard must defeat all three — they're rubric items. Why Vanilla JS, No Framework? Two reasons. Pedagogically: with no framework between you and the DOM, every concept (state, rendering, events, fetch lifecycles) is visible — and those concepts transfer to React/Vue/Svelte, while the reverse is not true. Practically: this capstone tests whether you can direct Gemini through UI work — layout, accessibility, async states — where the review skills differ from backend diffs: you verify with your eyes, the keyboard, and the network tab, not just pytest."},{"id":"what-you-build","title":"What You Build","text":"What You Build The Spec trackflow-dashboard — three files ( index.html , style.css , app.js ) plus a pure-logic module, no build step, opened via a static server: Order board: table of POs with color-coded state chips, filterable by state and customer, sortable by promised ship date SLA banner: a persistent strip showing breached / at-risk counts; clicking filters the board Detail drawer: clicking a row (or pressing Enter on it) slides open the order: line items, full audit timeline, carrier tracking events Live-ness: auto-refresh every 30s with a visible \"last updated\" stamp; manual refresh button; distinct loading / error / empty states Data layer: api.js with two implementations behind one interface — live (fetches the TrackFlow API from the API capstone ) and mock (deterministic in-memory data) selected by ?mode=mock Tested logic: the pure functions (SLA classification, filtering, sorting, event formatting) live in logic.js and run under node --test — no browser needed ┌───────────────────────────────────────────────────┐ │ TrackFlow Ops [Search PO/customer...] ↻ Updated 14:02:11 │ ├──────────────────────────────────────────────────┴ │ ⚠ 2 BREACHED · 5 AT RISK (click to filter) │ ├───────────────────────────────────────────────────┤ │ State: [All ▾] Customer: [All ▾] Sort: [Promised date ▾] │ │ PO-88412 Riverside Restaurants [SHIPPED] due 06-12 ● on time│ │ PO-88393 Hilltop Cafes [PICKING] due 06-11 ⚠ at risk│ │ PO-88371 Marina Foods [CONFIRMED] due 06-10 ❌ BREACH │ │ ▸ drawer: lines · audit timeline · carrier events │ └───────────────────────────────────────────────────┐"},{"id":"ide-workflow","title":"Executing This Capstone in VS Code / PyCharm (or WebStorm)","text":"Executing This Capstone in VS Code / PyCharm (or WebStorm) Everything in this project is built through Gemini Code Assist inside your IDE — never by copying finished code from elsewhere. Each phase uses some of these five moves ; every paste-block below names its move in the header. (Gemini Code Assist works identically in WebStorm if that's your JS home — it's the same JetBrains plugin.) Before you start (6-point checklist) Create the project folder and open it: VS Code File → Open Folder (PyCharm/WebStorm: File → Open ). New files via the Explorer panel / Project tool window. Confirm Gemini Code Assist is signed in: the ✦ icon in VS Code's Activity Bar opens the panel with no error badge (JetBrains: the Gemini tool window on the right edge greets you by account). Setup is module G01. Open the integrated terminal ( Ctrl+` in VS Code, Alt+F12 in JetBrains) for git and node --test . Serve the page from a static server — fetch() won't work from file:// . Easiest: python -m http.server 8000 in the integrated terminal, then open http://localhost:8000 (or VS Code's Live Server extension / JetBrains' built-in preview). After creating GEMINI.md in Phase 1, start a new chat so the layering rules load into context (the G05 lesson). Keep the browser DevTools open (F12) — console errors and the Network tab are the \"evidence\" you feed to /fix in this capstone (the G03 habit, frontend edition). Move VS Code PyCharm / WebStorm 1 · Spec-comment Type the comment in the editor and pause — ghost text appears. Tab accepts, Ctrl+→ accepts word-by-word, Esc rejects (G02) Same: type, pause, Tab ; hover the suggestion to cycle alternatives 2 · Chat / smart cmd Click the ✦ icon in the Activity Bar → chat panel opens. Select code first to scope it; /explain /fix /doc /simplify work here (G03) Gemini tool window (right edge) → Chat tab; same slash commands 3 · Generate tests Select the function → right-click → Gemini Code Assist → Generate unit tests — ask for node:test style in chat if it assumes Jest; save into tests/ (G04) Select → right-click → Gemini → Generate unit tests 4 · Agent ticket In the chat input, switch the Agent toggle ON → paste the ticket → review the plan in the panel → Accept/Reject each diff → click Allow when it asks to run a command (G06) Gemini tool window → Agent tab → paste the ticket; leave Auto-approve changes OFF; review diffs the same way 5 · Headless CLI Integrated terminal: gemini -p \"...\" — same login, same GEMINI.md rules as the IDE (G08) Example: a block labeled \"Move 4 · paste in Agent mode\" means: open the Gemini panel, flip the Agent toggle (VS Code) or open the Agent tab (JetBrains), paste, and work the plan→diff→approve loop."},{"id":"architecture","title":"Architecture: Three Layers, Even in Vanilla","text":"Architecture: Three Layers, Even in Vanilla project layout — this discipline IS the lesson Copy trackflow-dashboard/ ├── index.html semantic skeleton only — no inline JS ├── style.css design tokens as CSS custom properties ├── js/ │ ├── api.js data layer: liveApi + mockApi behind one interface │ ├── logic.js PURE functions: classifySla(order, now), │ │ filterOrders(orders, criteria), sortOrders(...), │ │ formatEvent(...) — no DOM, no fetch, no Date.now() │ │ (time is always a parameter — that's what makes it testable) │ └── app.js state + render + events; the ONLY file that touches the DOM ├── tests/ │ └── logic.test.mjs node --test, no browser required └── GEMINI.md / .aiexclude / .gemini/styleguide.md The non-negotiable rule (put it in GEMINI.md): logic.js imports nothing and touches nothing global — current time, orders, and filters always arrive as arguments. This single rule is what makes \"frontend logic\" testable with node --test and is the vanilla ancestor of every state-management pattern you'll later meet in frameworks."},{"id":"phases","title":"Build Phases","text":"Build Phases Phase What happens Skills from 1. Foundation GEMINI.md + skeleton + tokens G05, G02 2. Logic + data Pure functions, tests, dual API layer G02–G04 3. Render Board, banner, drawer, async states G02–G03 4. A11y + agent Accessibility audit; dark mode via agent G03, G06 5. Ship PR review + eyes-on verification G09 About the \"expected output\" blocks Frontend success is partly terminal output ( node --test ) and partly observable behavior — so the expected-output blocks below describe both. Your visual design will differ; the behaviors (which state shows when, where focus lands, what persists) must match exactly. Foundation: rules, skeleton, tokens New repo. GEMINI.md rules: the three-layer separation above; semantic HTML ( table for the board, button for actions — never clickable div s); all colors/spacing via CSS custom properties in :root ; every interactive element keyboard-reachable; loading/error/empty are three distinct UI states, never conflated. Then generate the skeleton from a spec-comment in index.html (Move 1: type an HTML comment describing the regions — header with search + refresh, SLA banner, filter bar, order table, drawer <aside> — pause for ghost text, accept section by section) and the token sheet in style.css the same way. ✅ Checkpoint Page renders the empty skeleton; HTML passes a quick chat audit (Move 2 — with index.html as the active file): \"/explain is this markup semantic? flag any div that should be a button, table, or nav\" . Logic and data: testable before visible Build logic.js function-by-function with spec-comments. The heart is SLA classification — spec it precisely: Move 1 · type in the editor (js/logic.js), pause for ghost text, Tab to accept Copy // classifySla(order, nowIso) -> \"ON_TIME\" | \"AT_RISK\" | \"BREACHED\" | \"MET\" // MET: order reached SHIPPED/DELIVERED on or before promised_ship_date. // BREACHED: not shipped and now is past end of promised_ship_date. // AT_RISK: not shipped and promised_ship_date is today or tomorrow. // ON_TIME: everything else. Treat dates as YYYY-MM-DD strings in local time. // Pure function: never call Date.now() — now arrives as a parameter. Generate tests (Move 3: select classifySla → right-click → Generate unit tests , then in chat demand \"node:test suite for classifySla covering all four outcomes plus the boundary: promised date == today\" ), run node --test tests/ in the integrated terminal, and iterate. Then api.js : mockApi first (deterministic orders covering every state and SLA class — generate it headlessly with Gemini CLI like the other capstones), then liveApi with timeouts and typed errors ( {kind: \"network\" | \"http\", status?} ) so the UI can distinguish failure from emptiness. expected output — pure logic, tested without a browser PS> node --test tests/ ✔ classifySla: MET when shipped on or before promised date ✔ classifySla: BREACHED when unshipped past promised date ✔ classifySla: AT_RISK when promised date is today (the boundary) ✔ classifySla: AT_RISK when promised date is tomorrow ✔ classifySla: ON_TIME otherwise ✔ filterOrders: state and customer filters combine (AND) ✔ filterOrders: empty criteria returns all orders ✔ sortOrders: promised date ascending, stable for ties ✔ formatEvent: ISO timestamp renders as local short form ℹ tests 14 • suites 4 • pass 14 • fail 0 • duration_ms 92 ✅ Checkpoint node --test all green with zero browser involvement — if any logic test needs a DOM, the function is in the wrong file (the frontend version of G04's \"failing tests indict the design\"). Render: where you review with your eyes Build app.js in chat-sized increments: render the board from mock data → wire filters/sort (calling logic.js) → SLA banner → drawer → auto-refresh with the \"last updated\" stamp. Then force the three async states and look at each: mock mode with empty data (empty state: \"No orders match\" + a clear-filters action), live mode with the API stopped (error state: \"Can't reach TrackFlow — data may be stale\" + retry), and a throttled network (loading state visible, UI not frozen). Use chat to fix what you see, feeding it evidence G03-style: paste the console error or describe the misbehavior precisely. expected behavior — the three async states, forced and observed http://localhost:8000/?mode=mock -> board renders 12 orders · banner reads \"⚠ 2 BREACHED · 3 AT RISK\" -> \"Last updated 14:02:11\" stamp ticks on every refresh EMPTY (mock mode, filter to a customer with no orders) -> \"No orders match your filters\" + [Clear filters] button -> banner counts unchanged (they reflect ALL orders, not the filter) ERROR (live mode, TrackFlow server stopped) -> red strip: \"Can't reach TrackFlow — data may be stale\" + [Retry] -> previous orders stay visible, marked stale — NOT a blank table -> DevTools console: one handled error log, no uncaught exceptions LOADING (DevTools → Network → throttle to Slow 3G, press Refresh) -> skeleton rows or spinner visible; filters remain clickable; the \"Last updated\" stamp does NOT advance until data lands The conflation trap Generated frontend code loves catch (e) { orders = [] } — which renders an API outage as \"no orders,\" the exact lie that gets a rep to tell a customer their order doesn't exist. Hunt for this pattern in every diff you accept; rejecting it is rubric item 3. Accessibility audit, then an agent-built feature First the audit — Move 2, attaching both files as context (the + /paperclip control in the chat box, or keep both open in editor tabs): \"Audit index.html + app.js for keyboard and screen-reader accessibility: tab order, focus management when the drawer opens/closes (focus moves in, Escape closes, focus returns to the row), aria-live for the SLA banner and 'last updated', missing labels. List concrete fixes.\" Apply and verify by unplugging your mouse — complete a full task (find a breached order, open its drawer, read tracking, close) with keys alone. Then the G06 ticket: Move 4 · paste in Agent mode (Agent toggle ON / Agent tab) Copy Add dark/light theme support: 1. All colors already flow through CSS custom properties — add a light theme as a [data-theme=\"light\"] override block. Do NOT touch component CSS. 2. A theme toggle button in the header (aria-pressed, persists in localStorage, defaults to the user's prefers-color-scheme). 3. Both themes must keep WCAG AA contrast for state chips and the SLA banner — list the contrast ratios you chose in your plan. Plan first. expected behavior — keyboard task and theme persistence KEYBOARD-ONLY TASK (mouse unplugged) Tab order: search → refresh → theme toggle → SLA banner → filters → first row Arrow/Tab to the breached row, press Enter -> drawer opens, focus lands on the drawer heading Tab through: line items → audit timeline → tracking events Press Esc -> drawer closes, focus RETURNS to the row you opened it from THEME Click toggle -> <html data-theme=\"light\">; aria-pressed flips to \"true\" DevTools console: localStorage.getItem(\"theme\") -> \"light\" Reload -> still light. Clear localStorage + reload -> follows OS prefers-color-scheme State chips and SLA banner readable in BOTH themes (AA: ≥4.5:1) ✅ Checkpoint The agent's plan listed real contrast ratios (challenge it if the warning-on-light pairing is below 4.5:1 — it often is); the diff touched only the token block, the toggle, and localStorage logic. Toggle works, persists, and respects the OS default on first visit. Ship: review gate plus the eyes-on checklist Push to GitHub; .gemini/styleguide.md must-flags: DOM access outside app.js, Date.now() inside logic.js, clickable non-button elements, catch-blocks that render errors as empty states, hardcoded colors bypassing tokens. Open the theme feature as a PR, process the review (G09 discipline). Final verification is manual and honest: the three async states, the keyboard-only task, both themes, and ?mode=mock vs live against your running TrackFlow API."},{"id":"rubric","title":"Grading Rubric","text":"Grading Rubric Layer discipline: logic.js has no DOM/fetch/Date.now(); app.js is the only DOM-toucher; the API swap (mock↔live) requires zero changes outside api.js Logic tested headlessly: node --test green, including the promised-date-equals-today boundary for classifySla Honest failure states: API-down renders an error state with retry — demonstrably distinct from the empty state (you killed the API and looked) Keyboard-complete: the full find-breach → open-drawer → read → close task works mouse-free, with correct focus management and Escape handling Freshness visible: auto-refresh works, \"last updated\" is accurate, and a failed refresh marks data as possibly stale instead of silently keeping old data Agent discipline: you challenged the agent's contrast ratios or rejected at least one out-of-scope hunk in the theme diff Review gate used: the theme PR was bot-reviewed; ≥1 finding fixed, ≥1 pushed back with reasoning"},{"id":"stretch","title":"Stretch Goals","text":"Stretch Goals Optimistic transitions: add a \"Mark Delivered\" action in the drawer that calls the API's transition endpoint, updates the UI optimistically, and rolls back with a toast on 409. URL state: filters and the open drawer encoded in the query string, so a rep can paste a link to a colleague that opens the exact same view. Big-board mode: a read-only rotation view for the warehouse wall TV (larger type, auto-cycling pages, breaches always pinned). Framework port: rebuild app.js in React keeping logic.js and api.js byte-identical — the layering pays off when only one of three layers changes. Where this goes on a resume \"Built an operations dashboard with layered vanilla-JS architecture (headlessly tested pure logic, swappable data layer), honest async states, full keyboard accessibility with managed focus, and WCAG AA dual themes; AI-assisted development with human-reviewed agent workflows.\" ← Previous Capstone PriorAuth: Healthcare Backend Finish → Back to Course Home"}]},{"file":"G00-orientation.html","title":"G00: Orientation — What Is Gemini Code Assist?","sections":[{"id":"what-is-gca","title":"Orientation: What Is Gemini Code Assist?","text":"Orientation: What Is Gemini Code Assist? You're about to spend 12 modules learning a tool that lives inside your editor and changes how you write software. This module gives you the complete picture first, so every later module slots into a map you already have. What Is Gemini Code Assist? Analogy First Imagine being assigned a new teammate who has read every programming book ever published, every page of documentation for every library you use, and millions of open-source repositories. They sit next to you all day. When you start typing a function, they quietly suggest how it might continue. When you're stuck on an error, you turn to them and ask. When you have a tedious multi-file change, you hand them the whole task and review their work before it lands. Before this teammate existed, all of that knowledge was scattered across Stack Overflow tabs, docs sites, and your own memory — and every lookup broke your flow. Gemini Code Assist is that teammate, installed as an extension in the editor you already use. It maps onto your daily work in three modes: autocomplete-style suggestions while you type, a chat panel when you want to ask, and an agent mode when you want to delegate. Technical Definition Gemini Code Assist is Google's AI coding assistant: a set of IDE Integrated Development Environment — the application you write code in, such as Visual Studio Code, IntelliJ IDEA, PyCharm, or Android Studio. extensions, a command-line tool, and a GitHub app, all powered by Google's Gemini models Google's family of large language models. Gemini 2.5 Flash and Pro are generally available in Code Assist; Gemini 3.x models are rolling out in preview. . It provides code completion Real-time, inline suggestions that appear as faded \"ghost text\" while you type. Press Tab to accept. , code generation from natural-language prompts, a chat assistant that understands your open files, an agent mode A mode where the AI plans and executes multi-step, multi-file tasks on its own, showing you diffs to approve before changes are applied. for multi-step tasks, and automated code review on pull requests. It works in VS Code , JetBrains IDEs (IntelliJ, PyCharm, GoLand, WebStorm…), Android Studio , and on GitHub . A companion terminal tool, Gemini CLI , shares the same license and configuration. Where it sits in your day The easiest way to understand Gemini Code Assist is to watch one developer task flow through it. Press play: A day with Gemini Code Assist — VS Code 9:02 You type: def convert_grams_to_ ounces(grams: float) -> float: ← ghost text appears ✓ You press Tab. Completion accepted. (Feature: code completion) 10:15 A test fails. You select the error, right-click → \"Gemini: Fix\" ✦ Chat explains the bug and proposes a one-line fix (Feature: smart actions) 13:40 You ask chat: \"How does auth work in this project?\" Gemini answers using your actual files as context (Feature: chat + codebase awareness) 15:30 You switch to Agent mode: \"Add a rating field to recipes — model, API, tests\" Agent plans: 4 files to change. Shows diffs. You review and approve. ✓ Multi-file change applied (Feature: agent mode) 16:45 You open a pull request on GitHub ✦ Gemini Code Assist posts a PR summary + line-by-line review (Feature: GitHub app) ▶ ▮▮ ↻ Press ▶ to watch a full day Why It Matters Google's own studies and DORA research report that developers using AI assistance complete common tasks measurably faster — and the biggest wins are not the autocomplete keystrokes. They come from the expensive interruptions that disappear: the 20-minute doc search that becomes a 20-second chat answer, the half-day multi-file refactor that becomes a reviewed agent run. If you write code for even 2 hours a day, mastering this tool pays for the ~8 hours this course takes within your first couple of weeks."},{"id":"feature-map","title":"The Feature Map","text":"The Feature Map Everything Gemini Code Assist does falls into six feature families. Each family gets one or more dedicated modules in this course. Hover over each card — this is the map we'll fill in module by module. ⚡ Code Completion & Generation Ghost-text suggestions as you type; whole functions generated from a comment. IDE editor pane • Module G02 💬 Chat, Smart Commands & Actions A conversation panel that knows your code. Slash commands like /fix and /doc ; right-click actions on selected code. IDE chat panel • Modules G03–G04 🧠 Context & Customization A 1M-token context window, full local codebase awareness, GEMINI.md rule files, and .aiexclude to keep secrets out. Project files • Module G05 🤖 Agent Mode Delegate multi-step, multi-file tasks. Plan review, diff approval, checkpoints, MCP tool servers, auto-approve mode. IDE chat panel (Agent toggle) • Modules G06–G07 ⌨️ Gemini CLI & GitHub Reviews The same brain in your terminal, plus an app that summarizes and reviews every pull request. Terminal + github.com • Modules G08–G09 ☁️ Google Cloud & Enterprise Deploy to Cloud Run from chat, Gemini inside BigQuery and Firebase, code customization from your private repos, enterprise security. Google Cloud console + IDE • Modules G10–G11 One lifecycle, one tool Press play to see how the features chain across the software lifecycle — this is the same path your capstone project will take in G11: Write completion → Understand chat → Refactor & Test smart actions → Build Features agent mode → Review GitHub app → Deploy Cloud Run ▶ ↻ Press ▶ to light up the lifecycle What Just Happened? You now have the whole map: six feature families covering write → understand → refactor → build → review → deploy. Every module from here on zooms into exactly one region of this map. If you ever feel lost later, come back to this diagram."},{"id":"editions","title":"Editions & Pricing","text":"Editions & Pricing Analogy First Think of a gym with three membership levels. The free day-pass gets you onto the main floor — real equipment, real workouts, but you can't book the private studios. The Standard membership adds priority booking and bigger usage limits. The Premium membership adds a personal trainer who has studied your training history specifically. Software teams face the same decision pain — paying for capacity they don't need, or hitting limits they didn't expect. Gemini Code Assist's three editions map exactly: free individual tier (the day-pass), Standard (higher limits + enterprise security), and Enterprise (everything, plus a model that has studied your private code). Individuals $0 / month Code completion, generation & chat Agent mode & Gemini CLI (generous free quotas) Sign in with a personal Google account No Google Cloud project needed Migrating to Antigravity June 18, 2026 (next section) Standard ~$19–22.80 / user / month Everything in Individuals, higher quotas Enterprise-grade security & data governance Local codebase awareness (large context) Google Cloud integrations (Cloud Run, BigQuery, Firebase…) IP indemnification Managed via a Google Cloud project Enterprise ~$45–54 / user / month Everything in Standard Code customization : suggestions tuned on your private repos GitHub / GitLab / Bitbucket code review integration Apigee & Application Integration support Advanced compliance controls Gotcha Prices above are list prices as of mid-2026 and vary by region, annual-commit discounts (~17% off), and promotions. Always check the official pricing page before budgeting : cloud.google.com/products/gemini/pricing . Quotas (requests/day, CLI invocations) also differ per edition — see the quotas page . Why It Matters Choosing wrong costs real money or real capability. A 10-person team on Enterprise that never uses code customization or PR reviews overpays roughly $3,000/year versus Standard. A solo consultant on the free tier who builds their workflow on it without reading the migration notice (next section) loses their assistant mid-project. Five minutes of edition-mapping now prevents both."},{"id":"antigravity","title":"The June 2026 Transition: Antigravity","text":"The June 2026 Transition: Antigravity ⚠ Read This Before You Commit To A Workflow Google has announced that Gemini Code Assist IDE extensions and Gemini CLI stop serving requests for the Individuals (free) tier and Google AI Pro/Ultra subscriber tiers on June 18, 2026 . Individual users are directed to migrate to Google Antigravity — Google's newer, agent-first development platform — and Antigravity CLI . Standard and Enterprise editions are not affected — they continue as the supported path for teams and businesses, which is why this course teaches Gemini Code Assist with the Standard/Enterprise feature set as its backbone. Source: official release notes . What this means for you You're learning for work / your team has Standard or Enterprise: nothing changes. Everything in this course applies. You're an individual on the free tier: you can still follow e

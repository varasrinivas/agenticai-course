<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Building AI Agents with Claude — mobile companion">
  <!-- Maskable safe area: keep meaningful content inside r=205 from center (~80% inner) -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="#0F1E36"/>
      <stop offset="100%" stop-color="#0A1628"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#E5BC5A"/>
      <stop offset="100%" stop-color="#C2902A"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed background (covers Android maskable bleed) -->
  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- Loop arrow suggesting the agent loop (LLM → tool → loop → done) -->
  <g transform="translate(256 256)">
    <circle r="170" fill="none" stroke="#1A2740" stroke-width="22"/>
    <path d="M 0,-170 A 170,170 0 1 1 -120.21,120.21"
          fill="none" stroke="url(#gold)" stroke-width="22" stroke-linecap="round"/>
    <!-- Arrowhead -->
    <polygon points="-105,140 -135,100 -90,95"
             fill="#E5BC5A" transform="rotate(-15)"/>
  </g>

  <!-- Bold "A" mark in the center -->
  <g transform="translate(256 256)">
    <text x="0" y="38"
          text-anchor="middle"
          font-family="'Bricolage Grotesque', 'Inter', system-ui, sans-serif"
          font-weight="800" font-size="200"
          fill="#E8ECF1"
          letter-spacing="-6">A</text>
  </g>
</svg>
